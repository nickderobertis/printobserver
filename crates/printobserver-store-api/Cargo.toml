[package]
name = "printobserver-store-api"
description = "The store port for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
printobserver-types = { path = "../printobserver-types", version = "0.2.0" }

# Test-only readers of this port's own source. The surface this port is held
# to — which methods the trait declares, which variants its error carries — is
# a claim about declarations, so the tests read the declarations rather than a
# table maintained beside them. Neither is a crate of this workspace, so the
# type crate stays this port's only workspace dependency.
[dev-dependencies]
quote = "1"
syn = { version = "3", features = ["full", "parsing", "printing", "extra-traits"] }

[lints]
workspace = true
