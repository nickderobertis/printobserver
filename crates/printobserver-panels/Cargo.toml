[package]
name = "printobserver-panels"
description = "Camera calibration, drift and alignment checks, and the check image's panels, for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate's own code is MIT; the label font it bundles, with its licence
# file beside it under `assets/`, is the SIL Open Font License's.
license = "MIT AND OFL-1.1"
repository.workspace = true
authors.workspace = true

[dependencies]
# The label font's reader, the one `imageproc`'s text drawing takes.
ab_glyph = "0.2"
base64.workspace = true
# The previous check's capture time, in the host's local time, in panel 3's
# label.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The decoders and encoder the frames and the check image need, and no other
# format: a camera frame is a JPEG and a landmark patch a PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Line drawing and the label text, with none of the crate's optional parallel
# or transform machinery.
imageproc = { version = "0.27", default-features = false, features = ["text"] }
nalgebra = "0.35"
printobserver-core = { workspace = true }
printobserver-types = { workspace = true }

[dev-dependencies]
jsonschema.workspace = true
# The interface the fixture tests stream a case's G-code into the real index
# builder through, as the printer port's whole-file read does.
printobserver-printer-api = { workspace = true }

# The recorded-frame tests, run as a project of their own.
[[test]]
name = "fixtures"
path = "tests/fixtures_suite/main.rs"

[lints]
workspace = true
