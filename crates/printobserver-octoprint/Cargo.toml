[package]
name = "printobserver-octoprint"
description = "OctoPrint adapter for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
log = "0.4"
printobserver-printer-api = { workspace = true }
printobserver-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A socket bound and never listened on: the address a journey hands out as
# unreachable stays held, which `std` cannot bind.
socket2 = "0.6"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "printing", "extra-traits"] }

[lints]
workspace = true
