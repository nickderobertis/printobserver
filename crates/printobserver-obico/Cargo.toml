[package]
name = "printobserver-obico"
description = "Obico adapter for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
printobserver-core = { path = "../printobserver-core", version = "0.3.0" }
printobserver-types = { workspace = true }
printobserver-vision-api = { path = "../printobserver-vision-api", version = "0.3.0" }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "webpki-roots"] }
# The runtime an acknowledgement runs on when the supervision core's own expiry
# driver asks for one: that thread polls a port's futures with no reactor of its
# own, and the HTTP client above needs Tokio's.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
jsonschema.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
