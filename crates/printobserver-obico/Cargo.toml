[package]
name = "printobserver-obico"
description = "Obico adapter for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
printobserver-core = { workspace = true }
printobserver-types = { workspace = true }
printobserver-vision-api = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "webpki-roots"] }
# The runtime an acknowledgement runs on when the supervision core's own expiry
# driver asks for one: that thread polls a port's futures with no reactor of its
# own, and the HTTP client above needs Tokio's.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# A socket bound and never listened on: the address a journey hands out as
# unreachable stays held, which `std` cannot bind.
socket2 = "0.6"
jsonschema.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
# The other end of a real TLS handshake with the adapter's own client, built on
# the same `rustls` that client is.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

[lints]
workspace = true
