[package]
name = "printobserver-oneharness"
description = "oneharness adapter for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-only. Builds `printobserver-oneharness-responder`, the binary this
# repository points a run at so OneHarness replaces the paid provider process
# with its own published deterministic responder. Off by default, so nothing an
# ordinary consumer installs carries it; this crate's own graph targets turn it
# on because its tests are the only thing that needs it.
test-responder = ["dep:oneharness"]

[dependencies]
oneharness-core.workspace = true
printobserver-supervisor-api.workspace = true
printobserver-types.workspace = true
serde.workspace = true
serde_json.workspace = true

# The CLI crate is here only for `oneharness::mock_harness`, the deterministic
# responder it publishes. A binary target cannot read a dev-dependency, so this
# is an optional ordinary dependency gated behind `test-responder` rather than a
# `[dev-dependencies]` entry.
oneharness = { workspace = true, optional = true }

[[bin]]
name = "printobserver-oneharness-responder"
path = "src/bin/responder.rs"
required-features = ["test-responder"]

[lints]
workspace = true
