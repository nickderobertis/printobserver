[package]
name = "printobserver-types"
description = "Shared domain types for printobserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
chrono = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
jsonschema = { version = "0.34", default-features = false }
proptest = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "printing", "extra-traits"] }

[lints]
workspace = true
