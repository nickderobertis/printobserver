schema_version: 1
budgets:
  - id: ci-check-time
    description: >-
      Longest job of a pull-request CI run. The longest job of one
      pull-request push's CI run from its start to its end, over every job of
      the run but `budgets`, read from the run's recorded jobs. Detail: every
      job with its start, end and queue seconds, each step's duration, and the
      span on the clock from the first start to the last end. Inner measure,
      because queue time is GitHub's shared capacity rather than this
      repository's work, so it is reported in the detail and not charged;
      `ci-job-count` bounds the slots that queueing depends on. Target at most
      3600 seconds, basis design. Workload: one pull-request push whose change
      reaches printobserver-core, so the affected tier is the whole graph — 29
      Nx projects (12 Rust crates), the 42-file end-to-end suite and the
      OctoPrint integration tier — on each of 5 platforms (linux-x86_64,
      linux-aarch64, windows-x86_64, windows-aarch64, macos-aarch64) on
      GitHub's hosted runners (4 processors, 3 on macOS), under the account's
      20 concurrent jobs shared by every repository; about 1.6 merged pull
      requests a day, each pushed 3 to 7 times. The aligned workflow: 8 jobs a
      pull-request push, one per platform for the gate and integration tier,
      none sharded. Evidence: the user's cap for a line met without sharding is
      3,600 s, the ceiling of any registered figure; the registered figure is
      the longest job of the aligned workflow's own whole-graph runs plus 20%,
      rounded up to 60 s, at most 3,600. It replaces `gate-time` (per required
      context, interim 3,600 s). Measured from telemetry, about 10 seconds: one
      read of the run's jobs. Enforced by the `budgets` job of every
      pull-request run of `ci.yml`.
    measure: reported
    command: ["uv", "run", "python", "-m", "repo_checks", "ci_check_time_budget"]
    unit: seconds
    direction: max
    threshold: 3600
    timeout_seconds: 120
  - id: ci-job-count
    description: >-
      CI jobs one pull-request push runs. Job instances that took a runner
      across every workflow run one pull-request push started, matrix cells
      counted one each, jobs an `if:` skipped without a runner not counted,
      `budgets` itself counted. Detail: each job's name, runner label and
      conclusion, and the count per runner family (Linux, Windows, macOS).
      Target at most 8 jobs, basis design: the create-repo shape for five
      platforms (`lint`, one `test` job per platform, `budgets`) plus
      `skilltest`, the paid real-print suite. Workload: one pull-request push
      whose change reaches printobserver-core, so the affected tier is the
      whole graph — 29 Nx projects (12 Rust crates), the 42-file end-to-end
      suite and the OctoPrint integration tier — on each of 5 platforms on
      GitHub's hosted runners (4 processors, 3 on macOS), under the account's
      20 concurrent jobs shared by every repository; about 1.6 merged pull
      requests a day, each pushed 3 to 7 times. The aligned workflow: 8 jobs a
      pull-request push, none sharded. Evidence: the whole-graph pull-request
      run the workflow this replaced made took 34 jobs (33 in ci.yml, 1 in
      notignored.yml). Measured from telemetry, about 10 seconds: one read of
      the run's jobs. Enforced by the `budgets` job of every pull-request run
      of `ci.yml`.
    measure: reported
    command: ["uv", "run", "python", "-m", "repo_checks", "ci_job_count_budget"]
    unit: jobs
    direction: max
    threshold: 8
    timeout_seconds: 120
