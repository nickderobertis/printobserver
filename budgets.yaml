schema_version: 1
budgets:
  - id: gate-time
    description: >-
      The critical-path span of one platform's required context — `gate
      (<platform>)` or `integration (<platform>)` — as
      `repo_checks.gate_jobs.platform_span` reads it from the current workflow
      run's recorded jobs: from the earliest real start of any job behind that
      context (the unsharded job, a shard, or the combined
      `macos-aarch64 (gate, integration)` job) to the start of the aggregating
      job's own `gate-time` step. It is how long a pull request waits on that
      platform's check. Inner measure, because a figure read inside the required
      job is what lets an over-budget context fail its own required check, and
      the queue before the platform's first job starts is GitHub capacity
      outside the repository's control; that queue is reported in the detail,
      beside every job behind the context with its start, end and queue seconds
      and each step's recorded duration. Sized for 10 required contexts — gate
      and integration on each of 5 platforms — on every pull-request push and
      push to main, about 1.6 merged pull requests a day. Enforced by the
      `gate-time` step of every job reporting one of those contexts; the release
      pull request's full sweep is measured and reported but not enforced.
    measure: reported
    command: ["uv", "run", "python", "-m", "repo_checks", "gate_time_budget"]
    unit: seconds
    direction: max
    threshold: 1800
    timeout_seconds: 120
