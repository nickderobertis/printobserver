# Repository-owned warm-pool maintenance. onevcs reads this declaration from
# the publication checkout's base branch and runs it only in idle slot worktrees.
# The recipe removes superseded Cargo builds older than two days, keeping each
# unit's newest build and every build modified within the last two days.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
