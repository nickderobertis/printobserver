# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The LLM-judge tier — separate from the deterministic `just check` gate.
# Run with `just lint-llm` (or `just lint-llm-diff` for the merge-base
# diff); the diff-scoped run is the blocking PR check, not part of `check`.
# Rules come from the pinned plugins below; tune one in place with
# `override: true`. Bump a plugin's `@version` pin to pull new rules.
files:
  # No `include`: llmlint lints the whole tree (exclude + .gitignore honored).
  # List committed files that shouldn't be judged (lock files, generated output).
  exclude:
    - "**/.git/**"
    # The scripts that made two real-print cases' parts: recorded evidence,
    # kept byte-identical to the commit they were printed from (45e7fed) and
    # never run by anything here.
    - "tests/real-prints/*/make_*.py"
    # The G-code the real prints ran, and the clean slices their faults were
    # planted in: recorded evidence, byte-identical to what was printed, so no
    # finding a judge made could be acted on without making it something else.
    # Each is a slicer's output of 10k to 20k lines that no rule here is about.
    - "tests/real-prints/fan-cut-bridge/fan-cut-test.clean.gcode"
    - "tests/real-prints/fan-cut-bridge/fan-cut-test.gcode"
    - "tests/real-prints/spaghetti-floating-slab/spaghetti-test.gcode"
    - "tests/real-prints/spaghetti-small-nest/spaghetti-two-stage.gcode"
    - "tests/real-prints/under-extrusion-lace/lace-test.clean.gcode"
    - "tests/real-prints/under-extrusion-lace/lace-test.gcode"
rationales: true
# No `agents` block: the harness/model are NOT pinned here. `oneharness.toml`
# (composed alongside this file) selects them in fallback mode — codex + gpt-5.5
# primary, claude-code + opus-4.8 secondary — so a Claude Code session falls
# through to claude-code with no config edit. Leaving the harness unset is what
# lets that fallback (or an ONEHARNESS_<FIELD> env override) decide.
plugins:
  - "https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/config_lint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/base.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/project-graph.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/shapes/cli.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/rust.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/python.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/typescript.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/ci.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/releasing.llmlint.yml@1"
rules:
  # The end-user README is out of this rule's reach. It restates the user-facing
  # contract by nature — the webhook URL, the configuration fields, the flags a
  # change carries — because it is addressed to a person setting a printer up.
  # Its install commands are already reconciled to AGENTS.md by the
  # `install-path` check, and holding the rest of its prose to a drift gate
  # would mean generating the README; the generated reference under
  # skills/printobserver/reference/ is where a restatement that must not drift
  # belongs.
  - name: contracts_have_one_source_or_a_drift_gate
    override: true
    files:
      exclude: ["README.md"]
