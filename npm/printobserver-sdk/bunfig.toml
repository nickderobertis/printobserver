# The fast tier's own configuration.
#
# `root` is `test` and deliberately: the printer-integration journey lives in
# `integration/`, drives a real OctoPrint, and is a tier of its own — a fast
# tier that swept it up would install OctoPrint on every gate run.
[test]
root = "test"
coverage = true
coverageThreshold = 0.95
coverageReporter = ["text"]
# The test files themselves are not what the threshold is over, and bun already
# leaves them out of the report on Linux and macOS. On Windows it does not
# recognise a test file under a backslashed path, reports each one, and holds
# it to the threshold; naming them here leaves every platform's report the same.
coveragePathIgnorePatterns = ["**/*.test.ts"]
