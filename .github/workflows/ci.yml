# SPIKE ONLY — spike-windows-gate-breakdown. Never merged.
#
# This branch's `ci.yml` is cut down to an experiment matrix, so that one
# pull-request run measures where the Windows gate's and every integration
# job's time goes on GitHub's real runners without spending the twelve
# ordinary jobs. Each `experiment` cell runs the gate's own checkout,
# toolchain and `just bootstrap` steps and then only the targets its
# experiment measures, through `just spike-cell`, which runs
# `tools/gate-spike/measure.py` once per `experiment|targets` pair; each
# `spike-integration` cell is one platform's `integration` job with its
# `just test-integration` step measured project by project. Every cell uploads
# its `spike-out` directory as an artifact. The real workflow is the base
# branch's; nothing here is meant to land.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: experiment (${{ matrix.cell.id }})
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.cell.platform }}
      PRINTOBSERVER_SERVICE_JOURNEY: required
    strategy:
      fail-fast: false
      matrix:
        cell:
          - id: windows-x86_64/rust-baseline
            platform: windows-x86_64
            runner: windows-2025
            runs: "baseline|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-x86_64/rust-nocov
            platform: windows-x86_64
            runner: windows-2025
            runs: "no-rust-coverage|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-x86_64/rust-defender
            platform: windows-x86_64
            runner: windows-2025
            runs: "defender-excluded|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-x86_64/rust-levers
            platform: windows-x86_64
            runner: windows-2025
            runs: "compile-only|printobserver:test;compile-only+line-tables-only|printobserver:test;compile-only+debug-0|printobserver:test;compile-only+rust-lld|printobserver:test"
          - id: windows-x86_64/py-baseline
            platform: windows-x86_64
            runner: windows-2025
            runs: "baseline|octoprint-env:test,printobserver-sdk-node:test,contract-codegen:test,printobserver-sdk-python:test,release-artifacts:test,repo-checks:test,printobserver:build,printer-smoke:test,skilltest-wiring:test"
          - id: windows-x86_64/py-coverage
            platform: windows-x86_64
            runner: windows-2025
            runs: "no-py-coverage|repo-checks:test;sysmon|repo-checks:test"
          - id: windows-x86_64/py-xdist
            platform: windows-x86_64
            runner: windows-2025
            runs: "xdist-2|repo-checks:test;xdist-3|repo-checks:test;xdist-4|repo-checks:test,release-artifacts:test"
          - id: windows-x86_64/py-defender
            platform: windows-x86_64
            runner: windows-2025
            runs: "defender-excluded|repo-checks:test,release-artifacts:test,printobserver:build,repo-e2e:test-e2e"
          - id: windows-x86_64/e2e
            platform: windows-x86_64
            runner: windows-2025
            runs: "baseline|bench:octoprint-lookup,host:defender,printobserver:build,repo-e2e:test-e2e"
          - id: windows-aarch64/rust-baseline
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "baseline|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-aarch64/rust-nocov
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "no-rust-coverage|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-aarch64/rust-defender
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "defender-excluded|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: windows-aarch64/rust-levers
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "compile-only|printobserver:test;compile-only+line-tables-only|printobserver:test;compile-only+debug-0|printobserver:test;compile-only+rust-lld|printobserver:test"
          - id: windows-aarch64/py-baseline
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "baseline|octoprint-env:test,printobserver-sdk-node:test,contract-codegen:test,printobserver-sdk-python:test,release-artifacts:test,repo-checks:test,printobserver:build,printer-smoke:test,skilltest-wiring:test"
          - id: windows-aarch64/py-coverage
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "no-py-coverage|repo-checks:test;sysmon|repo-checks:test"
          - id: windows-aarch64/py-xdist
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "xdist-2|repo-checks:test;xdist-3|repo-checks:test;xdist-4|repo-checks:test,release-artifacts:test"
          - id: windows-aarch64/py-defender
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "defender-excluded|repo-checks:test,release-artifacts:test,printobserver:build,repo-e2e:test-e2e"
          - id: windows-aarch64/e2e
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "baseline|bench:octoprint-lookup,host:defender,printobserver:build,repo-e2e:test-e2e"
          - id: linux-x86_64/rust-baseline
            platform: linux-x86_64
            runner: ubuntu-24.04
            runs: "baseline|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: linux-x86_64/rust-nocov
            platform: linux-x86_64
            runner: ubuntu-24.04
            runs: "no-rust-coverage|printobserver-types:test,printobserver-printer-api:test,printobserver-supervisor-api:test,printobserver-vision-api:test,printobserver-store-sqlite:test,printobserver-core:test,printobserver-octoprint:test,printobserver-obico:test,printobserver-oneharness:test,printobserver-server:test,printobserver-sdk:test,printobserver:test"
          - id: linux-x86_64/py
            platform: linux-x86_64
            runner: ubuntu-24.04
            runs: "baseline|octoprint-env:test,printobserver-sdk-node:test,contract-codegen:test,printobserver-sdk-python:test,release-artifacts:test,repo-checks:test,printobserver:build,printer-smoke:test,skilltest-wiring:test;no-py-coverage|repo-checks:test;sysmon|repo-checks:test;xdist-2|repo-checks:test;xdist-3|repo-checks:test;xdist-4|repo-checks:test,release-artifacts:test"
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      # No Rust cache: the Windows gate cells restore none today (the
      # repository's caches are over GitHub's 10 GB and the Windows gate's are
      # evicted), so a cold build is what is measured; and a spike that saved
      # caches would evict the real jobs' ones.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just install-tools release-plz
      - run: just spike-cell "${{ matrix.cell.runs }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ strategy.job-index }}-${{ matrix.cell.platform }}
          path: spike-out
          if-no-files-found: warn

  spike-integration:
    name: spike-integration (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
            runs: "baseline|printobserver-octoprint:test-integration,printobserver-server:test-integration,printobserver-sdk:test-integration,printobserver-sdk-python:test-integration,printobserver-sdk-node:test-integration,printobserver:test-integration,octoprint-env:test-integration"
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            runs: "baseline|printobserver-octoprint:test-integration,printobserver-server:test-integration,printobserver-sdk:test-integration,printobserver-sdk-python:test-integration,printobserver-sdk-node:test-integration,printobserver:test-integration,octoprint-env:test-integration"
          - id: macos-aarch64
            runner: macos-15
            runs: "baseline|printobserver-octoprint:test-integration,printobserver-server:test-integration,printobserver-sdk:test-integration,printobserver-sdk-python:test-integration,printobserver-sdk-node:test-integration,printobserver:test-integration,octoprint-env:test-integration"
          - id: windows-x86_64
            runner: windows-2025
            runs: "baseline|printobserver-octoprint:test-integration,printobserver-server:test-integration,printobserver-sdk:test-integration,printobserver-sdk-python:test-integration,printobserver-sdk-node:test-integration,printobserver:test-integration,octoprint-env:test-integration,bench:octoprint-lookup"
          - id: windows-aarch64
            runner: windows-11-arm
            runs: "baseline|printobserver-octoprint:test-integration,printobserver-server:test-integration,printobserver-sdk:test-integration,printobserver-sdk-python:test-integration,printobserver-sdk-node:test-integration,printobserver:test-integration,octoprint-env:test-integration,bench:octoprint-lookup"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The real integration job's own Rust cache, restored and never saved:
      # its compile inside `just test-integration` is measured as that job
      # pays it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: integration
          cache-save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just octoprint-up
      - run: just spike-cell "${{ matrix.platform.runs }}"
      - if: always()
        run: just octoprint-down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-integration-${{ matrix.platform.id }}
          path: spike-out
          if-no-files-found: warn
