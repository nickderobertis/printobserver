# SPIKE ONLY — spike-windows-gate-breakdown. Never merged.
#
# This branch's `ci.yml` is cut down to an experiment matrix, so that one
# pull-request run measures where the Windows gate's and every integration
# job's time goes on GitHub's real runners without spending the twelve
# ordinary jobs. Each `experiment` cell runs the gate's own checkout,
# toolchain and `just bootstrap` steps and then only the targets its
# experiment measures, through `just spike-cell`, which runs
# `tools/gate-spike/measure.py` once per `experiment|targets` pair; each
# `spike-integration` cell is one platform's `integration` job with its
# `just test-integration` step measured project by project. Every experiment
# and integration cell writes its measurements outside the checkout and
# uploads them as an artifact. Each `harness` cell runs the harness's own tests
# on one Windows runner, and measures nothing. The real workflow is the base
# branch's; nothing here is meant to land.
#
# Each Python cell measures its lever against a baseline taken on the same
# runner, because two runners of one image differ by more than most levers do.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: experiment (${{ matrix.cell.id }})
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.cell.platform }}
      PRINTOBSERVER_SERVICE_JOURNEY: required
    strategy:
      fail-fast: false
      matrix:
        cell:
          - id: linux-x86_64/comparisons
            platform: linux-x86_64
            runner: ubuntu-24.04
            runs: "baseline|*:test;no-rust-coverage|printobserver:test;base-tree+xdist-3|repo-checks:test"
          - id: windows-x86_64/py-xdist-2
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree|repo-checks:test;base-tree+xdist-2|repo-checks:test"
          - id: windows-x86_64/py-xdist-3
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree|repo-checks:test;base-tree+xdist-3|repo-checks:test"
          - id: windows-x86_64/py-xdist-4
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree|repo-checks:test;base-tree+xdist-4|repo-checks:test"
          - id: windows-x86_64/py-temp-on-d
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree|repo-checks:test;base-tree+temp-on-d|repo-checks:test"
          - id: windows-x86_64/py-temp-on-d-xdist-3
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree+temp-on-d|repo-checks:test;base-tree+temp-on-d+xdist-3|repo-checks:test"
          - id: windows-x86_64/e2e-temp-on-d
            platform: windows-x86_64
            runner: windows-2025
            runs: "base-tree|printobserver:build,repo-e2e:test-e2e;base-tree+temp-on-d|repo-e2e:test-e2e"
          - id: windows-x86_64/journey-temp-on-d
            platform: windows-x86_64
            runner: windows-2025
            runs: "baseline|printobserver:test;temp-on-d|printobserver:test"
          - id: windows-aarch64/py-xdist-3
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "base-tree|repo-checks:test;base-tree+xdist-3|repo-checks:test"
          - id: windows-aarch64/py-xdist-4
            platform: windows-aarch64
            runner: windows-11-arm
            runs: "base-tree|repo-checks:test;base-tree+xdist-4|repo-checks:test"
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      # `nx-set-shas` reads this workflow's own runs to derive the base.
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      # No Rust cache: the Windows gate cells restore none today (the
      # repository's caches are over GitHub's 10 GB and the Windows gate's are
      # evicted), so a cold build is what is measured; and a spike that saved
      # caches would evict the real jobs' ones.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just install-tools release-plz
      - run: just spike-cell "${{ matrix.cell.runs }}" "${{ runner.temp }}/spike-out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ strategy.job-index }}-${{ matrix.cell.platform }}
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  spike-integration:
    name: spike-integration (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
            runs: "baseline|*:test-integration"
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            runs: "baseline|*:test-integration"
          - id: macos-aarch64
            runner: macos-15
            runs: "baseline|*:test-integration"
          - id: windows-x86_64
            runner: windows-2025
            runs: "baseline|*:test-integration,bench:octoprint-lookup"
          - id: windows-aarch64
            runner: windows-11-arm
            runs: "baseline|*:test-integration,bench:octoprint-lookup"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The real integration job's own Rust cache, restored and never saved:
      # its compile inside `just test-integration` is measured as that job
      # pays it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: integration
          cache-save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just octoprint-up
      - run: just spike-cell "${{ matrix.platform.runs }}" "${{ runner.temp }}/spike-out"
      - if: always()
        run: just octoprint-down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-integration-${{ matrix.platform.id }}
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  harness:
    name: harness (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just spike-harness-test
