# Every check a pull request is held to, in eight jobs.
#
# * `lint`, once, on Linux: the formatters, the linters and the type checkers
#   over the affected projects, the Windows-target lint, the workflow lint and
#   the repository checks; the `test` tier with its coverage, the `build` tier
#   and the end-to-end tier over the affected projects tagged
#   `platform:independent` (`repo-policy.toml`'s `[gate]
#   platform_independent_tag`), whose suites exercise nothing a platform
#   changes; and, as steps, the pull-request title, the suppressions comment,
#   the Rust supply chain, the Agent Skill install and the judged lint.
# * `test (<platform>)`, one per supported platform: the `test` tier with its
#   coverage, the `build` tier and the end-to-end tier over every other affected
#   project, the per-project budgets, and the printer integration tier against a
#   real OctoPrint.
# * `skilltest`: the real-print suite, where its first step says the change
#   owes it.
# * `budgets`: this run's own two lines, `ci-check-time` and `ci-job-count` in
#   the root `budgets.yaml`, measured once every other job has ended.
#
# No job is sharded, and only `budgets` waits on another. `just ci-lint` and
# `just ci-test` are the two halves of `just check`'s work, and the release pull
# request runs them at the affected tier like any other; the full sweep is
# `just check all`, run by hand. AGENTS.md's "Commits, releases, and merging"
# records why.
#
# The `test` matrix is derived from AGENTS.md's "Supported platforms" list and
# `just check-repo` refuses it where the two disagree. `macos-aarch64` is the
# one consolidation: the account's few macOS slots are shared with other
# repositories, so its cell is the job `test-macos`, which reports `test
# (macos-aarch64)` itself and runs only on a pull request owing the macOS lane —
# every one but release automation's own. `repo-policy.toml`'s
# `[[workflows.carried]]` records it, and AGENTS.md's "The consolidated macOS
# lanes" says why.
#
# A pull request restores the caches `warm.yml` saves on every push to `main`,
# and saves none of its own: a cache a pull request saves is scoped to its merge
# ref, which no other run restores, so open pull requests saving theirs fill the
# repository's 10 GB quota and evict `main`'s. Bun's own cache cannot be split
# that way — the action saves on any ref whose key missed — so it is off, and its
# executable is restored by the cache action's restore half.
#
# The one cache a pull request saves is the real-print suite's LFS store, keyed
# on the cases' content: `skilltest` saves it only when that key missed, so only
# a pull request changing the cases saves one, and its later pushes restore it
# rather than download the cases again. `warm.yml` restores it on every push to
# `main`, which keeps `main`'s entry from the forge's 7-day eviction, and fetches
# and saves it when the key missed. Every restore of it falls back by key prefix
# to the newest older store, so a fetch downloads only the objects that store
# lacks. `.github/tests/caches.test.mjs` holds every cache step to this.

name: ci

# The pull-request trigger names GitHub's three default activity types and not
# `ready_for_review`: a pull request opened as a draft has already run every
# check on its commit, and lifting it out of draft changes no commit, so a run
# on the lift would repeat the draft's run on the same commit while the merge
# waits on it. The draft's results stand, because a check reports on the
# commit. A push to `main` runs `budgets` alone: the pull request that landed it
# ran every other job on the merge of its head into `main`.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    if: github.event_name == 'pull_request'
    # The judged lint and every deterministic tier that runs once: no matrix,
    # because a second cell would be a second verdict on one diff rather than a
    # second platform.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRINTOBSERVER_PLATFORM: linux-x86_64
    permissions:
      contents: read
      # `nx-set-shas` reads this workflow's runs.
      actions: read
      # The suppressions comment, upserted on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # The affected tier, the suppression check and the judged lint all
          # diff against the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # The base the affected tier is diffed against, exported as NX_BASE and
      # NX_HEAD: the merge base with `main`.
      - uses: nrwl/nx-set-shas@v4
      # Linux's `test` job's cache, which `warm.yml`'s `linux-x86_64` leg also
      # fills with the lints this job compiles.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: linux-x86_64
          cache-save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - run: just bootstrap
      # Under squash-merge the pull-request title becomes the commit release
      # automation reads.
      - run: just check-pr-title
        env:
          # Passed through the environment rather than interpolated into the
          # shell: the title is attacker-controlled on a fork pull request.
          PR_TITLE: ${{ github.event.pull_request.title }}
      # One sticky comment listing the suppressions this change adds, each with
      # its rule, its reason and a link to the line: a review artifact, never a
      # verdict. A fork's pull request is granted a read-only token, so the
      # upsert would fail on something the contributor has no way to fix.
      # `@v0` follows every 0.x release once its artifacts have published.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: nickderobertis/notignored@v0
      - run: just ci-lint
      # This half's Python coverage data, which `budgets` combines with each
      # platform's and rules on: a source and the tests measuring it can sit
      # on the two sides of the `platform:independent` tag.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-lint
          path: coverage-data/lint*
          if-no-files-found: error
          retention-days: 1
      # A real `gh skill install` of the Agent Skill from a copy of the tree,
      # with no GitHub credentials, under the release `repo-policy.toml` holds
      # gh at, installed from that release's own archive ahead of the runner's.
      - id: held
        run: just tool-version gh >> "$GITHUB_OUTPUT"
      - run: just install-gh ${{ steps.held.outputs.version }}
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just test-skill-install
      # The judged lint, last: its deterministic half first, so a config,
      # plugin or suppression slip fails without spending a harness call.
      - run: just setup-llmlint
      - run: just lint-llm-validate
      - run: just lint-llm-diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The Rust supply chain, last, so an advisory published upstream never
      # hides the verdicts before it; at the releases `repo-policy.toml` holds
      # the two tools at, installed prebuilt so the recipe's own install
      # compiles nothing. It reports and gates nothing, as the job it was before
      # this one did: a finding is a red step with its annotations and leaves
      # `lint` green, because an advisory published upstream is no defect of the
      # change under review, and fixing one is dependency work of its own.
      - id: deny
        run: just tool-version cargo-deny >> "$GITHUB_OUTPUT"
      - id: machete
        run: just tool-version cargo-machete >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ steps.deny.outputs.version }},cargo-machete@${{ steps.machete.outputs.version }}
      # llmlint: ignore[diagnostics_error_or_absent] suppressions.toml has the reason.
      - run: just supply-chain
        continue-on-error: true

  test:
    # The platform is in the name because that name is the status context a
    # branch-protection rule names: two cells reporting under one name are two
    # check runs the rule cannot tell apart.
    name: test (${{ matrix.platform.id }})
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      # The service-manager journey skips a case whose prerequisite a host lacks
      # (Docker for systemd, a password-free `sudo` for launchd); every hosted
      # runner here has its own, so a missing one fails the journey.
      PRINTOBSERVER_SERVICE_JOURNEY: required
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      actions: read
    # Git's own bash on the Windows runners rather than PowerShell, so every
    # cell runs its steps, and `just` finds the bash its recipes name, alike.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # The affected tier and the end-to-end tier diff against the base
          # branch, which a shallow checkout omits.
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      # The cache `warm.yml`'s leg for this platform saves.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ matrix.platform.id }}
          cache-save-if: false
      # `just` from the same action as the cargo tools: `extractions/setup-just`
      # has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - run: just runner-temp
      - run: just bootstrap
      # The release program every client's world carries, restored from the
      # cache `warm.yml` keeps for this platform under the source, toolchain
      # and profile it is built from; a restored program whose key no longer
      # holds is built over rather than used, by `just ci-integration`.
      - id: release-program
        run: just release-program-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .release-program
          key: release-program-${{ matrix.platform.id }}-${{ steps.release-program.outputs.key }}
      # The printer the integration tier drives, up before `just ci-test`,
      # which runs that tier beside its end-to-end tier.
      - run: just octoprint-up
      - run: just ci-test
      # This platform's half of the Python coverage data, for `budgets`.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.platform.id }}
          path: coverage-data/${{ matrix.platform.id }}*
          if-no-files-found: error
          retention-days: 1
      # Only the release pull request pays for the two-build maintenance
      # workload, and only on `linux-x86_64`: everywhere else it does nothing.
      - run: just budgets-release-pr
      # Both teardowns run after failure: stop the printer environment, then
      # restore usable temp for post-job actions before removing owned scratch.
      - if: always()
        run: just octoprint-down
      # A failed tier kept the instance's own logs before that bring-down, and
      # they are uploaded so the first failing run is the one diagnosed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octoprint-diagnostics-${{ matrix.platform.id }}
          path: .octoprint-diagnostics
          if-no-files-found: warn
      - if: always()
        run: just runner-temp cleanup

  # `macos-aarch64`'s cell of `test`, as a job of its own so that a condition
  # can leave it off release automation's version/changelog pull request without
  # taking a runner: that pull request is this repository's own head branch
  # under the prefix `release-plz.toml` names, and owes no macOS lane. A job its
  # condition skips reports its context as a success.
  test-macos:
    name: test (macos-aarch64)
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-plz-'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PRINTOBSERVER_PLATFORM: macos-aarch64
      PRINTOBSERVER_SERVICE_JOURNEY: required
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: macos-aarch64
          cache-save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - run: just runner-temp
      - run: just bootstrap
      - id: release-program
        run: just release-program-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .release-program
          key: release-program-macos-aarch64-${{ steps.release-program.outputs.key }}
      - run: just octoprint-up
      - run: just ci-test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-macos-aarch64
          path: coverage-data/macos-aarch64*
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: just octoprint-down
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octoprint-diagnostics-macos-aarch64
          path: .octoprint-diagnostics
          if-no-files-found: warn
      - if: always()
        run: just runner-temp cleanup

  # The real-print suite, on the harness and model production runs. Its first
  # step says whether the change owes it, by `repo-policy.toml`'s `[skilltest]
  # owed_paths`; where it is not owed every later step but the store's is
  # skipped and the job passes, and a classifier that could not answer owes it.
  # A failed test fails this job: nothing retries.
  skilltest:
    name: skilltest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The real-print cases' LFS store, restored, and saved where its key missed.
      REAL_PRINTS_STORE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # The classifier diffs against the merge base, which a shallow
          # checkout does not carry.
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - id: classify
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: just skilltest-classify "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      # Before anything costs anything: a run with no credential fails saying so.
      - if: steps.classify.outputs.owed != 'false'
        run: just skilltest-credential
      - if: steps.classify.outputs.owed != 'false'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: linux-x86_64
          cache-save-if: false
      - if: steps.classify.outputs.owed != 'false'
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - if: steps.classify.outputs.owed != 'false'
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - if: steps.classify.outputs.owed != 'false'
        uses: actions/setup-node@v4
      - if: steps.classify.outputs.owed != 'false'
        run: just bootstrap
      # The steps `tests/real-prints-lfs/ci-steps.yml` holds, verbatim.
      - id: real-prints-key
        if: env.REAL_PRINTS_STORE == 'true'
        run: just real-prints-cache-key >> "$GITHUB_OUTPUT"
      - id: real-prints-cache
        if: env.REAL_PRINTS_STORE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.real-prints-key.outputs.key }}
          restore-keys: real-prints-lfs-
      - if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit != 'true'
        run: just real-prints-fetch
      - if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.real-prints-key.outputs.key }}
      - if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit == 'true'
        run: just real-prints-checkout
      - if: steps.classify.outputs.owed != 'false'
        run: just skilltest-install-harness
      - if: steps.classify.outputs.owed != 'false'
        run: just skilltest-record
      - if: always() && steps.classify.outputs.owed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: skilltest-report
          path: tests/skilltest/results/latest.json
          if-no-files-found: warn

  # This run's own two lines, measured once every other job has ended however
  # it ended: the longest job of the run, and how many jobs took a runner. It
  # builds and tests nothing, and on a push to `main` it is the one job. On a
  # pull request it also rules on the Python coverage floor per platform, over
  # `lint`'s kept data combined with each platform's: the one place both halves
  # of a source's tests meet.
  budgets:
    name: budgets
    needs: [lint, test, test-macos, skilltest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The two budgets read this run's jobs off the jobs API.
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: false
      - run: just ci-budgets
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-python-*
          path: coverage-data
          merge-multiple: true
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: just coverage-combine coverage-data
