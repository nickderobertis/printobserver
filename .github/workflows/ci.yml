# The gate, on the supported platform matrix, plus the judged-lint tier and the
# pull-request-title lint as jobs of their own.
#
# The gate runs `just check` at the tier `just gate-tier` answers for the event:
# the affected tier on an ordinary pull request and on a push to `main`, each
# against an explicitly derived base, and the full sweep on the release pull
# request `release-plz` opens — the one point every batched release passes
# through before it ships. AGENTS.md's "Commits, releases, and merging" records
# why the sweep sits there.
#
# The matrices below are derived from AGENTS.md's "Supported platforms" list and
# `just check-repo` refuses one if the two disagree, so this file cannot be
# narrowed independently of that list.
# Which jobs carry one at all is `repo-policy.toml`'s
# `workflows.platform_dependent_kinds`.

name: ci

# The pull-request trigger names GitHub's three default activity types and not
# `ready_for_review`: a pull request opened as a draft has already run every
# check on its commit, and lifting it out of draft changes no commit, so a run
# on the lift would repeat the draft's run on the same commit (the macOS and
# Windows gates take about two hours) while the merge waits on it. The draft's
# results stand, because a check reports on the commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-shard-windows-aarch64:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      PRINTOBSERVER_SERVICE_JOURNEY: required
    name: gate-shard (${{ matrix.platform.id }}, ${{ matrix.platform.shard }}/${{ matrix.platform.shards }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 1
            shards: 3
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 2
            shards: 3
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 3
            shards: 3
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      # DEMONSTRATION ONLY: shard 2 fails on purpose, every other shard passes.
      - run: |
          if [ "$GATE_SHARD" = 2/3 ]; then echo "shard $GATE_SHARD fails on purpose"; exit 1; fi
          echo "shard $GATE_SHARD passes"
        env:
          GATE_SHARD: ${{ matrix.platform.shard }}/${{ matrix.platform.shards }}

  # The required `gate (windows-aarch64)` context: it waits on every shard
  # whatever each concluded, and fails unless each succeeded. Its one verdict
  # reads nothing of the platform, so it takes no runner of that platform's.
  gate-windows-aarch64:
    name: gate (windows-aarch64)
    needs: [gate-shard-windows-aarch64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just shard-verdict gate windows-aarch64
        env:
          NEEDS: ${{ toJSON(needs) }}

