# SPIKE ONLY — spike-windows-gate-breakdown. Never merged.
#
# This branch's `ci.yml` is cut down to an experiment matrix, so that one
# pull-request run measures where the Windows gate's and every integration
# job's time goes on GitHub's real runners without spending the twelve
# ordinary jobs. Each `experiment` cell runs the gate's own checkout,
# toolchain and `just bootstrap` steps and then only the targets its
# experiment measures, through `just spike-cell`, which runs
# `tools/gate-spike/measure.py` once per `experiment|targets` pair; each
# `spike-integration` cell is one platform's `integration` job with its
# `just test-integration` step measured project by project. Every cell writes
# its measurements outside the checkout and uploads them as an artifact. The real workflow is the base
# branch's; nothing here is meant to land.
#
# Each Python cell measures its lever against a baseline taken on the same
# runner, because two runners of one image differ by more than most levers do.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just spike-harness-test
