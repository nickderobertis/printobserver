# The gate, on the supported platform matrix, plus the judged-lint tier and the
# pull-request-title lint as jobs of their own.
#
# The gate runs `just check` at the tier `just gate-tier` answers for the event:
# the affected tier on an ordinary pull request and on a push to `main`, each
# against an explicitly derived base, and the full sweep on the release pull
# request `release-plz` opens — the one point every batched release passes
# through before it ships. AGENTS.md's "Commits, releases, and merging" records
# why the sweep sits there.
#
# The matrices below are derived from AGENTS.md's "Supported platforms" list and
# `just check-repo` refuses one if the two disagree, so this file cannot be
# narrowed independently of that list.
# Which jobs carry one at all is `repo-policy.toml`'s
# `workflows.platform_dependent_kinds`.
#
# macOS is the one exception, and it is a consolidation rather than a
# narrowing: the account's few macOS slots are shared with other repositories,
# so the gate's and the integration tier's `macos-aarch64` cells run as jobs of
# their own — the gate's two shards and `integration-macos` — and only on a
# pull request the classifier (`.github/macos-policy.mjs`) says owes them.
# `repo-policy.toml`'s `[[workflows.carried]]` records the two cells as
# carried, and AGENTS.md's "The consolidated macOS lanes" says why.

name: ci

# The pull-request trigger names GitHub's three default activity types and not
# `ready_for_review`: a pull request opened as a draft has already run every
# check on its commit, and lifting it out of draft changes no commit, so a run
# on the lift would repeat the draft's run on the same commit (the macOS and
# Windows gates take about two hours) while the merge waits on it. The draft's
# results stand, because a check reports on the commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this run owes the macOS lane: an ordinary pull request does, and
  # release automation's own version/changelog-only pull request and every push
  # do not. Unknown is never omission — a pull request it cannot read owes it.
  classify:
    name: classify
    runs-on: ubuntu-24.04
    outputs:
      macos-required: ${{ steps.classify.outputs.macos-required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The classifier diffs the pull request against its merge base and
          # reads release-plz.toml off the base, neither of which a shallow
          # checkout carries.
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: just macos-classify "$GITHUB_EVENT_PATH" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  gate:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      # The service-manager journey skips a case whose prerequisite a host lacks
      # (Docker for systemd, a password-free `sudo` for launchd); every hosted
      # runner here has its own, so on the merge path a missing one fails the
      # journey rather than skipping it.
      PRINTOBSERVER_SERVICE_JOURNEY: required
      # What the `gate-time` step reads this run's jobs with. At job level
      # because a dispatch by hand carries a step's literal environment alone,
      # and leaves this out: that run reads the public jobs API unauthenticated.
      GITHUB_TOKEN: ${{ github.token }}
    # The cell's platform is in the name because that name is the status context
    # a branch-protection rule names: two cells reporting under one name are two
    # check runs the rule cannot tell apart, so it cannot require both.
    # `macos-aarch64` is sharded below, `gate-macos` reporting its context.
    name: gate (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          # The two Windows gates are sharded: `gate-shard-<platform>` runs
          # each one's work and `gate-<platform>` reports its context.
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      # `nx-set-shas` reads this workflow's own runs on `main` to find the last
      # commit the gate passed on, which is the base a push is diffed against.
      actions: read
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # The affected tier, the end-to-end tier and the suppression check all
          # diff against the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # The base the affected tier is diffed against, derived explicitly and
      # exported as NX_BASE and NX_HEAD: the merge base with `main` on a pull
      # request, and the last commit this workflow passed on for a push to it.
      - uses: nrwl/nx-set-shas@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # `just` from the same action as the cargo tools: `extractions/setup-just`
      # has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] suppressions.toml has the reason.
      - run: just check "$(just gate-tier)"
      # Only the release pull request pays for the two-build maintenance workload.
      - run: just budgets-release-pr
      - if: always()
        run: just runner-temp cleanup
      # The `gate-time` budget, last so that the span it reads ends here.
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: gate

  # A platform whose gate does not fit one runner in the 30 minutes each
  # platform is held to is split: one matrix cell per shard, each running the
  # gate tiers `just gate-shards <shards>` hands that shard, and an aggregating
  # job carrying the required name. AGENTS.md's "Commits, releases, and merging"
  # records which platform is split and the run that measured it over.
  gate-shard-windows-aarch64:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      PRINTOBSERVER_SERVICE_JOURNEY: required
    name: gate-shard (${{ matrix.platform.id }}, ${{ matrix.platform.shard }}/${{ matrix.platform.shards }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 1
            shards: 5
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 2
            shards: 5
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 3
            shards: 5
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 4
            shards: 5
          - id: windows-aarch64
            runner: windows-11-arm
            shard: 5
            shards: 5
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # The affected tier, the end-to-end tier and the suppression check all
          # diff against the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # The base the affected tier is diffed against, derived explicitly and
      # exported as NX_BASE and NX_HEAD: the merge base with `main` on a pull
      # request, and the last commit this workflow passed on for a push to it.
      - uses: nrwl/nx-set-shas@v4
      # A cache per shard: each compiles different things — the first the
      # Rust crates' instrumented test builds, the second the lints, the debug
      # program the Python suites run and the build tier, the last three the
      # debug program the end-to-end tier runs — and one key shared by all
      # would hold whichever shard saved first.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: shard-${{ matrix.platform.shard }}-of-${{ matrix.platform.shards }}
      # `just` from the same action as the cargo tools: `extractions/setup-just`
      # has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] suppressions.toml has the reason.
      - run: just check-shard "$(just gate-tier)" "$GATE_SHARD"
        env:
          GATE_SHARD: ${{ matrix.platform.shard }}/${{ matrix.platform.shards }}
      - if: always()
        run: just runner-temp cleanup

  # The required `gate (windows-aarch64)` context: it waits on every shard
  # whatever each concluded, and fails unless each succeeded. Its one verdict
  # reads nothing of the platform, so it takes no runner of that platform's.
  gate-windows-aarch64:
    name: gate (windows-aarch64)
    needs: [gate-shard-windows-aarch64]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The `gate-time` step reads this run's jobs.
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just shard-verdict gate windows-aarch64
        env:
          NEEDS: ${{ toJSON(needs) }}
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: gate
          PRINTOBSERVER_PLATFORM: windows-aarch64
          GITHUB_TOKEN: ${{ github.token }}

  gate-shard-windows-x86_64:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      PRINTOBSERVER_SERVICE_JOURNEY: required
    name: gate-shard (${{ matrix.platform.id }}, ${{ matrix.platform.shard }}/${{ matrix.platform.shards }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-x86_64
            runner: windows-2025
            shard: 1
            shards: 5
          - id: windows-x86_64
            runner: windows-2025
            shard: 2
            shards: 5
          - id: windows-x86_64
            runner: windows-2025
            shard: 3
            shards: 5
          - id: windows-x86_64
            runner: windows-2025
            shard: 4
            shards: 5
          - id: windows-x86_64
            runner: windows-2025
            shard: 5
            shards: 5
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # The affected tier, the end-to-end tier and the suppression check all
          # diff against the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # The base the affected tier is diffed against, derived explicitly and
      # exported as NX_BASE and NX_HEAD: the merge base with `main` on a pull
      # request, and the last commit this workflow passed on for a push to it.
      - uses: nrwl/nx-set-shas@v4
      # A cache per shard: each compiles different things — the first the
      # Rust crates' instrumented test builds, the second the lints, the debug
      # program the Python suites run and the build tier, the last three the
      # debug program the end-to-end tier runs — and one key shared by all
      # would hold whichever shard saved first.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: shard-${{ matrix.platform.shard }}-of-${{ matrix.platform.shards }}
      # `just` from the same action as the cargo tools, as every gate cell takes
      # it, so the two Windows shard jobs set their hosts up alike.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] suppressions.toml has the reason.
      - run: just check-shard "$(just gate-tier)" "$GATE_SHARD"
        env:
          GATE_SHARD: ${{ matrix.platform.shard }}/${{ matrix.platform.shards }}
      - if: always()
        run: just runner-temp cleanup

  # The required `gate (windows-x86_64)` context: it waits on every shard
  # whatever each concluded, and fails unless each succeeded. Its one verdict
  # reads nothing of the platform, so it takes no runner of that platform's.
  gate-windows-x86_64:
    name: gate (windows-x86_64)
    needs: [gate-shard-windows-x86_64]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The `gate-time` step reads this run's jobs.
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just shard-verdict gate windows-x86_64
        env:
          NEEDS: ${{ toJSON(needs) }}
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: gate
          PRINTOBSERVER_PLATFORM: windows-x86_64
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      # What the `gate-time` step reads this run's jobs with, at job level for
      # the reason the gate job's gives.
      GITHUB_TOKEN: ${{ github.token }}
    # Named by platform id, not runner, so a new runner image renames no
    # required check; each cell reports the context AGENTS.md's required-checks
    # record names, and that record says how the live protection follows a rename.
    name: integration (${{ matrix.platform.id }})
    # The printer integration tier, against a real OctoPrint. It is a job of
    # its own rather than one of `just check`'s tiers because it installs
    # OctoPrint, starts it and waits a print out — but it runs on every change,
    # on every platform AGENTS.md's supported-platform list names for which its
    # "Virtual printer availability" block records no exclusion — `macos-aarch64`
    # in the `integration-macos` job below rather than in a cell of its own.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      # The `gate-time` step reads this run's jobs.
      actions: read
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      # The release program every client's world carries, in a cache of its
      # own: keyed on the source, toolchain and profile it is built from, and
      # saved only when that key missed, so it holds one program and nothing of
      # the Rust toolchain's cache. A restored program whose key no longer
      # holds is built over rather than used.
      - id: release-program
        run: just release-program-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .release-program
          key: release-program-${{ matrix.platform.id }}-${{ steps.release-program.outputs.key }}
      - run: just release-program
      - run: just octoprint-up
      - run: just test-integration
      # Both teardowns run after failure: stop the printer environment, then
      # restore usable temp for post-job actions before removing owned scratch.
      - if: always()
        run: just octoprint-down
      - if: always()
        run: just runner-temp cleanup
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: integration

  # The gate and the printer integration tier for `macos-aarch64`: the gate in
  # two macOS shards behind an aggregator, and the integration tier in a macOS
  # job of its own, all side by side and only on a pull request the classifier
  # says owes the lane. On a pull request it could not answer they run anyway:
  # unknown is never omission. No other event runs them, and a job its
  # condition skips reports its context as a success, so a pull request owing no
  # macOS lane still reports both. Three at once is the most
  # `.github/budgets.yaml` lets one run ask for.
  gate-shard-macos-aarch64:
    env:
      PRINTOBSERVER_PLATFORM: ${{ matrix.platform.id }}
      # As in the gate's own cells: on the merge path a service-manager case
      # whose prerequisite is missing fails rather than skipping.
      PRINTOBSERVER_SERVICE_JOURNEY: required
      # The Windows-target lint reads the committed tree alone, and every Linux
      # gate cell runs it.
      PRINTOBSERVER_HOST_INDEPENDENT: elsewhere
    name: gate-shard (${{ matrix.platform.id }}, ${{ matrix.platform.shard }}/${{ matrix.platform.shards }})
    needs: classify
    if: >-
      !cancelled() && (needs.classify.outputs.macos-required == 'true' ||
      (github.event_name == 'pull_request' && needs.classify.result != 'success'))
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: macos-aarch64
            runner: macos-15
            shard: 1
            shards: 2
          - id: macos-aarch64
            runner: macos-15
            shard: 2
            shards: 2
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      # A cache per shard: the first compiles the Rust crates' instrumented test
      # builds and the debug program the end-to-end tier runs, the second the
      # lints, the debug program the Python suites run and the build tier.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: shard-${{ matrix.platform.shard }}-of-${{ matrix.platform.shards }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] suppressions.toml has the reason.
      - run: just check-shard "$(just gate-tier)" "$GATE_SHARD"
        env:
          GATE_SHARD: ${{ matrix.platform.shard }}/${{ matrix.platform.shards }}
      - if: always()
        run: just runner-temp cleanup

  # The required `gate (macos-aarch64)` context: it waits on both shards
  # whatever each concluded, and fails unless each succeeded — except where the
  # classifier owed no macOS lane and skipped them, where it is skipped too.
  gate-macos:
    name: gate (macos-aarch64)
    needs: [gate-shard-macos-aarch64]
    if: always() && needs.gate-shard-macos-aarch64.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The `gate-time` step reads this run's jobs.
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just shard-verdict gate macos-aarch64
        env:
          NEEDS: ${{ toJSON(needs) }}
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: gate
          PRINTOBSERVER_PLATFORM: macos-aarch64
          GITHUB_TOKEN: ${{ github.token }}

  integration-macos:
    name: integration (macos-aarch64)
    needs: classify
    if: >-
      !cancelled() && (needs.classify.outputs.macos-required == 'true' ||
      (github.event_name == 'pull_request' && needs.classify.result != 'success'))
    runs-on: macos-15
    env:
      PRINTOBSERVER_PLATFORM: macos-aarch64
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      # The `gate-time` step reads this run's jobs.
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just runner-temp
      - run: just bootstrap
      - id: release-program
        run: just release-program-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .release-program
          key: release-program-macos-aarch64-${{ steps.release-program.outputs.key }}
      - run: just release-program
      - run: just octoprint-up
      - run: just test-integration
      - if: always()
        run: just octoprint-down
      - if: always()
        run: just runner-temp cleanup
      - name: gate-time
        run: just gate-time
        env:
          GATE_TIME_KIND: integration

  llmlint:
    name: llmlint
    # The judged tier is a job of its own rather than a step inside the gate:
    # it is non-deterministic and needs a harness credential, and a gate that
    # could not run without one would stop being the deterministic gate.
    # No matrix: a second cell over a text diff would be a second verdict from
    # that non-deterministic judge, not a second platform.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just setup-llmlint
      # The deterministic half runs first: a config, plugin or suppression slip
      # fails here without spending a harness call.
      - run: just lint-llm-validate
      - run: just lint-llm-diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  skill-install:
    name: skill-install
    # A real `gh skill install` of this repository's Agent Skill, from a copy of
    # the tree and with no GitHub credentials, and `gh skill publish --dry-run`
    # over it. A job of its own rather than a tier of the gate: it needs GitHub
    # CLI at the release `repo-policy.toml` holds, which this job installs and
    # the gate's runners are not given. No matrix: what `gh skill` reads and
    # writes is the tree's own files, the same whichever host reads them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      # The release `repo-policy.toml` holds gh at, installed from that
      # release's own archive once its published checksums vouch for it, ahead
      # of the runner's own gh on PATH.
      - id: held
        run: just tool-version gh >> "$GITHUB_OUTPUT"
      - run: just install-gh ${{ steps.held.outputs.version }}
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just test-skill-install

  supply-chain:
    name: supply-chain
    # The Rust supply-chain gate: `deny.toml`'s advisory, licence, ban and
    # source policy, and no unused dependency. A job of its own rather than a
    # tier of the gate, and no matrix: what it reads is the lockfile's
    # dependency graph, which is the same on every platform, so a second cell
    # would read the same graph again. Nothing needs it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      # The releases `repo-policy.toml` holds the two tools at, installed
      # prebuilt, so the recipe's own install finds them held and compiles
      # nothing.
      - id: deny
        run: just tool-version cargo-deny >> "$GITHUB_OUTPUT"
      - id: machete
        run: just tool-version cargo-machete >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ steps.deny.outputs.version }},cargo-machete@${{ steps.machete.outputs.version }}
      - run: just supply-chain

  pr-title:
    name: pr-title
    # Under squash-merge the pull-request title becomes the commit release
    # automation reads, so it is linted as a required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just check-pr-title
        env:
          # Passed through the environment rather than interpolated into the
          # shell: the title is attacker-controlled on a fork pull request.
          PR_TITLE: ${{ github.event.pull_request.title }}
