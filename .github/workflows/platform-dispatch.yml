# One job of `ci.yml` or of `install-path.yml`, on one supported platform, by
# hand — and no other job.
#
# A push starts every job of every workflow that fires on it, one cell per
# platform each, and the hosted macOS runners are a handful of slots shared
# with other work. Bringing a platform up means running one cell over and over
# while it is red, and a pull request is the wrong lever for that: it starts
# every cell to re-run one. So this workflow takes the name of a job and the
# name of a platform as the two inputs of a manual dispatch and runs exactly
# that job's steps on exactly that platform's runner.
#
# Every job here is a COPY of the job it is named after, with the platform
# matrix replaced by the one cell the dispatch named: the `if` selects it, the
# `runs-on` maps the platform to the runner `AGENTS.md`'s supported-platform
# list declares for it, and the steps are the source job's own. `just
# check-repo`'s `platform-dispatch` holds each copy to its source — the
# trigger set, both inputs' options, every `if`, every runner and every step
# — so a copy cannot drift from the job it stands in for. The jobs proving a
# registry carry no version here, so each proves the newest its registry
# serves; the source jobs read the release their run cut, which no dispatch
# has.
#
# `repo-policy.toml`'s `[dispatch]` names this workflow, its two inputs and
# the two workflows its jobs come from; every other check that classifies a
# job by its steps passes this workflow over, because classified by their
# steps its jobs would be a second gate and a second integration tier with no
# matrix of their own.

name: platform-dispatch

on:
  workflow_dispatch:
    inputs:
      job:
        description: The job to run, by its name in `ci.yml` or `install-path.yml`.
        required: true
        type: choice
        options:
          - gate
          - integration
          - prove-registry-pypi
          - prove-registry-npm
          - prove-registry-script
          - prove-registry-client-rust
          - prove-registry-client-python
          - prove-registry-client-node
          - install-route-pypi
          - install-route-npm
          - install-route-script
      platform:
        description: The platform to run it on, as `AGENTS.md`'s supported-platform list names it.
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-aarch64
          - windows-x86_64
          - windows-aarch64

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ inputs.platform }})
    if: inputs.job == 'gate'
    # The one cell the dispatch named: the platform maps to the runner the
    # supported-platform list declares for it, and every job below shares
    # the map through this anchor.
    runs-on: &runner ${{ fromJSON('{"linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","macos-aarch64":"macos-15","windows-x86_64":"windows-2025","windows-aarch64":"windows-11-arm"}')[inputs.platform] }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The end-to-end tier and the suppression check both diff against the
          # base branch, which a shallow checkout omits.
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just check

  integration:
    name: integration (${{ inputs.platform }})
    if: inputs.job == 'integration'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: just bootstrap
      - run: just octoprint-up
      - run: just test-integration
      # The one condition in this job, and it is on the teardown: an
      # environment that outlived a failing tier is a runner nobody stopped.
      - if: always()
        run: just octoprint-down

  prove-registry-pypi:
    name: prove-registry-pypi (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-pypi'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      # No Rust toolchain is set up here, and that is the point of these three
      # routes: each carries a program already built for the platform, and the
      # proof takes what it strips off the path anyway.
      - run: just prove-registry-pypi

  prove-registry-npm:
    name: prove-registry-npm (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-npm'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
      - run: just prove-registry-npm

  prove-registry-script:
    name: prove-registry-script (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-script'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just prove-registry-script

  prove-registry-client-rust:
    name: prove-registry-client-rust (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-client-rust'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      # The one client whose consumer is built: `cargo` resolves the crate the
      # registry serves and builds the committed smoke check against it. The
      # supervisor it runs against is still taken with no toolchain on the
      # path, by the install-script route.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: just prove-registry-client-rust

  prove-registry-client-python:
    name: prove-registry-client-python (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-client-python'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - run: just prove-registry-client-python

  prove-registry-client-node:
    name: prove-registry-client-node (${{ inputs.platform }})
    if: inputs.job == 'prove-registry-client-node'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
      - run: just prove-registry-client-node

  install-route-pypi:
    name: install-route-pypi (${{ inputs.platform }})
    if: inputs.job == 'install-route-pypi'
    runs-on: *runner
    steps:
      - uses: actions/setup-python@v5
      - run: pip install printobserver-cli
      - run: printobserver --version
      # Neither of these two can succeed unattended, so each is non-fatal and
      # each is reported: `repo-policy.toml`'s `waived_steps` is why, and
      # `crates/printobserver/tests/service.rs` is what proves the installer
      # instead.
      - id: install-service
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      - if: always()
        env:
          INSTALLED: ${{ steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || steps.start-service-launchd.outcome }}
        run: 'echo "install-route-pypi: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'

  install-route-npm:
    name: install-route-npm (${{ inputs.platform }})
    if: inputs.job == 'install-route-npm'
    runs-on: *runner
    steps:
      - uses: actions/setup-node@v5
      - run: npm install -g printobserver-cli
      - run: printobserver --version
      - id: install-service
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      - if: always()
        env:
          INSTALLED: ${{ steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || steps.start-service-launchd.outcome }}
        run: 'echo "install-route-npm: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'

  install-route-script:
    name: install-route-script (${{ inputs.platform }})
    if: inputs.job == 'install-route-script'
    runs-on: *runner
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install.sh | sh
      - run: printobserver --version
      - id: install-service
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      - if: always()
        env:
          INSTALLED: ${{ steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || steps.start-service-launchd.outcome }}
        run: 'echo "install-route-script: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'
