# What this repository's own tiers do on a macOS and on a Windows runner, said
# rather than enforced.
#
# Scaffolding with a stated end. AGENTS.md's supported-platform list names the
# four platforms below with every cell of theirs recorded as not running yet,
# and `docs/platform-bring-up.md` is the record of what each tier said here.
# The platform nodes that follow bring the tiers up against that record, and
# the documentation node of that plan deletes this workflow once the
# `platform-exclusions` block is empty.
#
# It cannot fail its run, whatever a step reports: every step continues on
# error, and the last step of each job writes every step's own `outcome` into
# the run's summary — `outcome` and not `conclusion`, because
# `continue-on-error` is what makes `conclusion` read `success` for a step that
# failed. What a failed tier said is in that step's own log, which is where the
# record quotes it from.
#
# One job per new runner, each naming that runner directly. No platform matrix:
# this is not one of `repo-policy.toml`'s platform-dependent job kinds, and it
# deliberately runs none of the recipes that would make it one — not `just
# check`, which invokes every tier at once, not the OctoPrint bring-up, not a
# `prove-` recipe and not the judged tier. Each of the gate's deterministic
# tiers runs as a step of its own instead, so one that fails does not hide
# what the ones after it would have said.

name: platform-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash on the Windows runners, so every step is one script on all four.
    shell: bash

jobs:
  probe-macos-aarch64:
    name: probe-macos-aarch64
    runs-on: macos-15
    # A job that could still fail its run would be a tier; this one only reports.
    continue-on-error: true
    # Under the six-hour default, so the summary step is reached even when
    # every tier runs out its own step timeout.
    timeout-minutes: 330
    steps:
      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: setup-just
        continue-on-error: true
        uses: extractions/setup-just@v3
      - id: setup-rust
        continue-on-error: true
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - id: install-cargo-tools
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v7
      - id: setup-bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - id: bootstrap
        continue-on-error: true
        timeout-minutes: 40
        run: just bootstrap
      - id: format-check
        continue-on-error: true
        timeout-minutes: 10
        run: just format-check
      - id: lint
        continue-on-error: true
        timeout-minutes: 30
        run: just lint
      - id: typecheck
        continue-on-error: true
        timeout-minutes: 30
        run: just typecheck
      - id: test
        continue-on-error: true
        timeout-minutes: 45
        run: just test
      - id: coverage
        continue-on-error: true
        timeout-minutes: 45
        run: just coverage
      - id: build
        continue-on-error: true
        timeout-minutes: 30
        run: just build
      - id: lint-workflows
        continue-on-error: true
        timeout-minutes: 10
        run: just lint-workflows
      - id: check-repo
        continue-on-error: true
        timeout-minutes: 15
        run: just check-repo
      - id: test-e2e
        continue-on-error: true
        timeout-minutes: 60
        run: just test-e2e
      - if: always()
        continue-on-error: true
        env:
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_SETUP_JUST: ${{ steps.setup-just.outcome }}
          OUTCOME_SETUP_RUST: ${{ steps.setup-rust.outcome }}
          OUTCOME_INSTALL_CARGO_TOOLS: ${{ steps.install-cargo-tools.outcome }}
          OUTCOME_SETUP_UV: ${{ steps.setup-uv.outcome }}
          OUTCOME_SETUP_BUN: ${{ steps.setup-bun.outcome }}
          OUTCOME_BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          OUTCOME_FORMAT_CHECK: ${{ steps.format-check.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_TEST: ${{ steps.test.outcome }}
          OUTCOME_COVERAGE: ${{ steps.coverage.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_LINT_WORKFLOWS: ${{ steps.lint-workflows.outcome }}
          OUTCOME_CHECK_REPO: ${{ steps.check-repo.outcome }}
          OUTCOME_TEST_E2E: ${{ steps.test-e2e.outcome }}
        run: >-
          echo -e "## probe-macos-aarch64: macos-aarch64 on macos-15\n
          - checkout: $OUTCOME_CHECKOUT\n
          - setup-just: $OUTCOME_SETUP_JUST\n
          - setup-rust: $OUTCOME_SETUP_RUST\n
          - install-cargo-tools: $OUTCOME_INSTALL_CARGO_TOOLS\n
          - setup-uv: $OUTCOME_SETUP_UV\n
          - setup-bun: $OUTCOME_SETUP_BUN\n
          - just bootstrap: $OUTCOME_BOOTSTRAP\n
          - just format-check: $OUTCOME_FORMAT_CHECK\n
          - just lint: $OUTCOME_LINT\n
          - just typecheck: $OUTCOME_TYPECHECK\n
          - just test: $OUTCOME_TEST\n
          - just coverage: $OUTCOME_COVERAGE\n
          - just build: $OUTCOME_BUILD\n
          - just lint-workflows: $OUTCOME_LINT_WORKFLOWS\n
          - just check-repo: $OUTCOME_CHECK_REPO\n
          - just test-e2e: $OUTCOME_TEST_E2E" >> "$GITHUB_STEP_SUMMARY"

