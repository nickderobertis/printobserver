# The end-user install path and the three clients, proven against what the
# registries actually serve.
#
# Two jobs per ROUTE, because the three routes are alternatives to one another.
# `prove-registry-*` runs the tier `AGENTS.md`'s "The registry install-path
# proof" records; `install-route-*` runs that path's own stated commands, in the
# order `AGENTS.md`'s "The end-user install path" states them — and `just
# check-repo` refuses a step of one of those jobs that section does not state,
# so this workflow cannot grow an install nobody declared. And one job per
# CLIENT, `prove-registry-client-*`, each taking that client from the registry
# a dependent takes it from and running its own smoke check against the
# supervisor the same release's asset carries.
#
# Nothing here runs on a change. Every one of these six proofs takes its
# artifact from a registry, so over a pull request it could only report what
# was published before the change — and the six each start one job per
# supported platform, which on the hosted macOS runners is a cost no change
# should pay for a proof of somebody else's release. A change's own proof of
# what it built is the end-to-end tier's `prove-client-*` and `prove-route-*`
# journey, in the gate.
#
# Two things a reader has to know that are not written down elsewhere. The
# release-time trigger is `release-plz` HAVING FINISHED rather than the release
# being published, because that workflow cuts the release before the two jobs
# that build and publish its artifacts. And WHICH release a release-time run
# proves is the one that run itself published, handed to every route proof as
# one concrete version — never "the newest the forge lists", which on a
# repository releasing from every push is somebody else's release as often as
# not. After a push-triggered run, `resolve` reads it off the tag left at the
# run's own commit; after a hand-dispatched run, which publishes an existing
# tag from `main`, it reads the record that run uploaded saying which.

name: install-path

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to prove. `release` takes the newest release the forge
          published; naming none takes the newest each registry serves.
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: [release-plz]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: a run stopped part way through is a route nobody
  # proved, and this workflow is the only thing that would have said so.
  group: install-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which release the triggering run cut, resolved once for the whole run.
  #
  # Its output is the version every route proof below is given, so the three
  # cannot resolve three different releases between them; and it is what those
  # jobs are gated on, so an ordinary push — which finishes a `release-plz` run
  # and cuts nothing — proves nothing rather than proving whatever was newest.
  #
  # Deliberately NOT gated on that run having succeeded. A run that cut the
  # release and then failed to publish its artifacts concludes as a failure,
  # and it is the state this tier exists to find: the version is there to
  # prove, nothing serves it, and the proof says `NOT SERVED`. A conclusion
  # gate skips exactly that run, and the missing publish is reported by
  # nothing at all.
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    # `actions: read` is what downloading another run's artifact needs, and
    # nothing here writes.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.cut.outputs.version || steps.dispatched.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release-time run's own commit, and the whole history with it:
          # which release that run cut is read off the tag it left there, and a
          # shallow clone carries neither the commit nor the tag.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - id: cut
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: just release-version "$COMMIT" . >> "$GITHUB_OUTPUT"
      # A dispatched release run publishes an existing tag from `main`, so no
      # tag at its commit says which: it uploads a record saying so, and that
      # record is read here. A dispatch refused at `release` uploads none, so
      # this download fails naming the missing artifact and nothing below is
      # proven — one red run beside the red dispatch. Spelled `github.token`
      # rather than as a secret: `gh-secrets.json` lists what this repository
      # holds, and the workflow's own token is not a secret it holds.
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch'
        with:
          name: dispatched-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dispatched-release
      - id: dispatched
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch'
        run: just release-version-dispatched "$RUNNER_TEMP/dispatched-release/version" >> "$GITHUB_OUTPUT"

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-pypi:
    name: prove-registry-pypi (${{ matrix.platform.id }})
    # A release-time run proves the release IT cut, and nothing when it cut
    # none. Not gated on that run's conclusion: a run whose release exists and
    # whose publish failed is the one this tier is for.
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      # The one concrete version this whole run proves: what a caller named, or
      # the release the triggering run cut. Never the committed tree's own
      # number, which is whatever release automation last wrote there, and
      # never each route's own idea of "the newest".
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      # No Rust toolchain is set up here, and that is the point of these three
      # routes: each carries a program already built for the platform, and the
      # proof takes what it strips off the path anyway.
      - run: just prove-registry-pypi

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-npm:
    name: prove-registry-npm (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
      - run: just prove-registry-npm

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-script:
    name: prove-registry-script (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      - run: just prove-registry-script

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-client-rust:
    name: prove-registry-client-rust (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      # The one client whose consumer is built: `cargo` resolves the crate the
      # registry serves and builds the committed smoke check against it. The
      # supervisor it runs against is still taken with no toolchain on the
      # path, by the install-script route.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: just prove-registry-client-rust

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-client-python:
    name: prove-registry-client-python (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      - run: just prove-registry-client-python

  # llmlint: ignore[live_tier_compiles_and_requires_credential] suppressions.toml has the reason.
  prove-registry-client-node:
    name: prove-registry-client-node (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    env:
      PRINTOBSERVER_PROOF_VERSION: ${{ inputs.version || needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    # Git's own bash on the Windows runners rather than PowerShell, so that
    # every cell runs its steps, and `just` finds the bash its recipes name, the
    # same way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # `extractions/setup-just` has no build for the `windows-11-arm` runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
      - run: just prove-registry-client-node

  install-route-pypi:
    name: install-route-pypi (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/setup-python@v5
      - run: pip install printobserver-cli
      - run: printobserver --version
      # Neither of these two can succeed unattended, so each is non-fatal and
      # each is reported: `repo-policy.toml`'s `waived_steps` is why, and
      # `crates/printobserver/tests/service.rs` is what proves the installer
      # instead.
      - id: install-service
        if: runner.os != 'Windows'
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # The Windows pair, in the elevated PowerShell the section states it for:
      # the runner's own session is elevated, and the installer refuses one
      # that is not.
      - id: install-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.ps1 | iex
      - id: start-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-Service -Name printobserver -StartupType Automatic -Status Running
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      # The pair this cell ran is its platform's own service manager's, so the
      # outcomes reported are that pair's; the other managers' steps did not
      # run here and would only ever say `skipped`.
      - if: always()
        shell: bash
        env:
          INSTALLED: ${{ runner.os == 'Windows' && steps.install-service-windows-service.outcome || steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || runner.os == 'macOS' && steps.start-service-launchd.outcome || steps.start-service-windows-service.outcome }}
        run: 'echo "install-route-pypi: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'

  install-route-npm:
    name: install-route-npm (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/setup-node@v5
      - run: npm install -g printobserver-cli
      - run: printobserver --version
      - id: install-service
        if: runner.os != 'Windows'
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # The Windows pair, in the elevated PowerShell the section states it for:
      # the runner's own session is elevated, and the installer refuses one
      # that is not.
      - id: install-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.ps1 | iex
      - id: start-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-Service -Name printobserver -StartupType Automatic -Status Running
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      # The pair this cell ran is its platform's own service manager's, so the
      # outcomes reported are that pair's; the other managers' steps did not
      # run here and would only ever say `skipped`.
      - if: always()
        shell: bash
        env:
          INSTALLED: ${{ runner.os == 'Windows' && steps.install-service-windows-service.outcome || steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || runner.os == 'macOS' && steps.start-service-launchd.outcome || steps.start-service-windows-service.outcome }}
        run: 'echo "install-route-npm: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'

  install-route-script:
    name: install-route-script (${{ matrix.platform.id }})
    needs: resolve
    if: github.event_name != 'workflow_run' || needs.resolve.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-aarch64
            runner: macos-15
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - if: runner.os != 'Windows'
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install.sh | sh
      - if: runner.os != 'Windows'
        run: printobserver --version
      # The PowerShell form puts the program on the path of the session it ran
      # in and of every later one; a new step is a new process, which carries
      # neither. So the check runs in that same session, as a caller who pasted
      # the one-line command and then typed the check does.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install.ps1 | iex
          printobserver --version
      - id: install-service
        if: runner.os != 'Windows'
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.sh | sudo sh
      - id: start-service-systemd
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo systemctl enable --now printobserver.service
      - id: start-service-launchd
        if: runner.os == 'macOS'
        continue-on-error: true
        run: sudo launchctl bootstrap system /Library/LaunchDaemons/io.github.nickderobertis.printobserver.plist
      # The Windows pair, in the elevated PowerShell the section states it for:
      # the runner's own session is elevated, and the installer refuses one
      # that is not.
      - id: install-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm https://raw.githubusercontent.com/nickderobertis/printobserver/main/scripts/install-service.ps1 | iex
      - id: start-service-windows-service
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-Service -Name printobserver -StartupType Automatic -Status Running
      # `outcome` and not `conclusion`: `continue-on-error` is what makes
      # `conclusion` say `success` for a step that failed, so a report reading
      # it would say every route's service came up every time.
      # The pair this cell ran is its platform's own service manager's, so the
      # outcomes reported are that pair's; the other managers' steps did not
      # run here and would only ever say `skipped`.
      - if: always()
        shell: bash
        env:
          INSTALLED: ${{ runner.os == 'Windows' && steps.install-service-windows-service.outcome || steps.install-service.outcome }}
          STARTED: ${{ runner.os == 'Linux' && steps.start-service-systemd.outcome || runner.os == 'macOS' && steps.start-service-launchd.outcome || steps.start-service-windows-service.outcome }}
        run: 'echo "install-route-script: service installation $INSTALLED, service startup $STARTED" >> "$GITHUB_STEP_SUMMARY"'
