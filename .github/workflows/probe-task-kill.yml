# TEMPORARY diagnostic, removed before this change is finished: what keeps the
# per-user task's instance alive after its server is killed, on both Windows
# runners.
name: probe-task-kill
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - shell: pwsh
        run: wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
      - shell: pwsh
        env:
          PROBE_HOLDS: "none,held,timewait"
          GH_TOKEN: ${{ github.token }}
        run: .github/probe/task-kill-probe.ps1
