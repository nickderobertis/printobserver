# Automated releases from Conventional Commits. No manual invocation, no manual
# step: a push to `main` is the only trigger, and merging the release pull
# request this opens is the only human action in a release.
#
# `release-plz.toml` is the configuration; `release-targets.toml` declares what
# reaches which registry.

name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-pr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The release pull request is opened under RELEASE_PLZ_TOKEN rather
          # than the workflow's built-in token: a pull request opened by the
          # built-in token does not trigger the workflows that gate it, so it
          # could auto-merge having been checked by nothing.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz,cargo-semver-checks
      - run: release-plz release-pr --backend github
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: release
    needs: release-pr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz,cargo-semver-checks
      # Tags, cuts the GitHub Release, and publishes every crate target
      # `release-targets.toml` declares. Idempotent: a version already on the
      # registry is skipped, so a partial failure is recovered by the next push.
      - run: release-plz release --backend github
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
