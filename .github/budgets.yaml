schema_version: 1
budgets:
  # Two budgets rather than one, an approved exception: both the jobs-per-run
  # and the macOS-spending runs-per-change bounds are explicitly requested, and
  # separate budgets were approved for these two scheduling constraints.
  # Neither figure is a part of the other: a change can stay within its run
  # count while one of its runs occupies several shared macOS slots.
  - id: printobserver-macos-jobs-per-run
    description: >-
      The most macOS runner job instances any one resolved workflow run requests,
      matrix cells and reusable-workflow jobs included, over every event class
      one change meets and the one manual diagnostic dispatch. Inner measure,
      because one run can occupy several of the five shared macOS slots even
      when the change's count of macOS-spending runs stays within its bound.
      Read off the telemetry `github-workflows:test` records from the committed
      workflow graph.
    labels: [telemetry]
    measure: reported
    command:
      - node
      - macos-budget.mjs
      - --metric
      - jobs-per-run
      - --telemetry
      - .telemetry/macos-policy.json
    unit: jobs
    direction: max
    threshold: 1
    timeout_seconds: 60
  - id: printobserver-macos-runs-per-change
    description: >-
      How many distinct workflow runs request a macOS runner over one change's
      whole automatic life — its pull request, its merge, the release pull
      request and its merge, the release build, the downstream install-path
      proofs and the weekly schedules — with manual diagnostics outside it.
      Read off the telemetry `github-workflows:test` records from the committed
      workflow graph.
    labels: [telemetry]
    measure: reported
    command:
      - node
      - macos-budget.mjs
      - --metric
      - runs-per-change
      - --telemetry
      - .telemetry/macos-policy.json
    unit: runs
    direction: max
    threshold: 2
    timeout_seconds: 60
