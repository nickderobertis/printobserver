schema_version: 1
budgets:
  - id: printobserver-pool-maintenance-seconds
    description: >-
      Wall-clock time of one steady-state pool maintenance pass after one run's
      superseded builds. Bounds how long maintenance holds a warm slot out of service.
    labels: [host]
    measure: reported
    command: ["./measure.sh"]
    unit: seconds
    direction: max
    threshold: 20
    timeout_seconds: 1800
