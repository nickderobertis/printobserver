# The machine-readable half of this repository's own rules.
#
# `AGENTS.md` is the prose half and is authoritative for the things a reader
# needs in prose — the supported platforms, the merge model, the end-user
# install path. This file holds the facts a check needs to be deterministic
# about, so that no check has to guess and no rule is stated twice.
#
# `just check-repo` reads this file. `uv run -q repo-check --help` lists the
# individual checks.

schema_version = 1

[repository]
owner = "nickderobertis"
name = "printobserver"
base_branch = "main"

[gate]
# Every tier `just check` must invoke, the end-to-end tier included. `just
# check-repo` refuses a `check` recipe that omits one of these, and refuses any
# recipe in the set whose body would run nothing.
tiers = [
    "format-check",
    "lint",
    "typecheck",
    "test",
    "coverage",
    "build",
    "lint-workflows",
    "check-repo",
    "test-e2e",
]

[gate.coverage]
# Line-coverage floors. 95% is the create-repo default and nothing here lowers
# it. Each ecosystem measures its own suite and fails its own build below the
# floor; there is no combined cross-language number, because a single blended
# figure lets one language's coverage pay for another's.
rust = 95
python = 95
typescript = 95

[llmlint]
# The judged-lint tier. Like the two tiers below it declares a `tier` recipe,
# which is what the documentation check reads every tier outside the gate off —
# so this tier is inventoried by being declared here rather than by a check
# knowing its name.
#
# It is deliberately NOT one of `gate.tiers`: it is non-deterministic and needs
# a harness credential, and a gate that could not run without one would stop
# being the deterministic gate. So it is a continuous-integration job of its
# own, in the workflow named below, and `just check-repo` refuses a gate job
# that runs it.
#
# `validate` is its deterministic half, which the job runs first so that a
# config, plugin or suppression slip fails without spending a harness call;
# `whole_tree` is the same judge over the tree rather than over a diff, which
# nothing in continuous integration runs.
tier = "lint-llm-diff"
validate = "lint-llm-validate"
whole_tree = "lint-llm"
setup = "setup-llmlint"
workflow = "ci.yml"

[suppressions]
# The ONE way to suppress a diagnostic in this repository. Every suppression
# directive in the tree needs an entry here naming the rule, the file, the site
# and a non-empty reason; `just check-repo` refuses a directive without one, an
# entry without a reason, and an entry that matches nothing.
allowlist = "suppressions.toml"

# The only rules a WHOLE-FILE directive may name, and the narrowest the
# exception can be made.
#
# Every deterministic linter and type checker here attributes each finding to a
# line, so a whole-file directive from one of them is always broader than the
# finding it answers, and `just check-repo` refuses it with no exception at all.
# llmlint is the one tool with rules that are about a file as a whole — whether
# a script's output is signal, whether its inputs are validated — and for those
# a whole-file directive is the only shape that fits.
#
# The permission is llmlint's alone and reaches only the rules named here; a
# directive naming any other rule is refused, and every use still needs its own
# entry in the allowlist above, with a reason. Adding a name to this list is a
# deliberate, reviewable change rather than something a directive can do for
# itself.
whole_file_rules = ["tool_output_is_signal", "boundary_inputs_validated"]

[integration]
# The printer integration tier, and the two recipes that bracket it. These
# names are the one source: `just check-repo` holds the committed
# continuous-integration job to them, so a job that ran something other than
# this repository's own recipes, or omitted the bring-up or the bring-down, is
# refused. The tier is deliberately not one of `gate.tiers`: it installs
# OctoPrint, starts it and waits a print out, so it is a job of its own rather
# than something every gate run pays for.
tier = "test-integration"
bring_up = "octoprint-up"
bring_down = "octoprint-down"
# The block in `AGENTS.md` recording the platforms the virtual printer is
# unavailable on, each with its reason. Empty today; the integration job's
# matrix is the supported-platform list minus whatever it names.
exclusions_block = "virtual-printer-exclusions"

[obico]
# The scheduled Obico tier, and the two recipes that bracket it. These names are
# the one source: `just check-repo` holds the committed workflow to them, so a
# workflow that ran something other than this repository's own recipes, or
# omitted the bring-up or the bring-down, is refused.
#
# The tier is deliberately not one of `gate.tiers` and `just check-repo` refuses
# a tree in which it is: it builds Obico's own images, starts four containers
# including a machine-learning service, and waits a real failure alert out, so it
# is minutes of startup that every gate run would otherwise pay for. It runs on a
# schedule instead, which is what `triggers` below is about.
tier = "test-obico"
bring_up = "obico-up"
bring_down = "obico-down"
workflow = "obico.yml"
# The ONLY triggers that workflow may carry. A schedule it names and a manual
# invocation, and nothing that fires on a change: a tier this expensive that ran
# on every push would be the gate again under another name.
triggers = ["schedule", "workflow_dispatch"]
# The block in `AGENTS.md` recording the schedule the tier runs on. It and the
# workflow's own `cron` entries are checked against each other, so a schedule
# recorded in prose cannot drift from the one that actually fires.
schedule_block = "obico-tier-schedule"
# The section of `AGENTS.md` that records the tier: what it proves, why it is not
# in every run, and how to run it by hand.
section = "The scheduled Obico tier"

[ingress]
# The Obico ingress answer bound, and the producer's own timeout it must stay
# below. `just check-repo` reads the shipped default and the server's own copy of
# the producer's timeout out of the source below, reads the recorded timeout out
# of AGENTS.md's block, and refuses a tree in which the default is not below the
# recorded timeout, in which no timeout is recorded, or in which the two copies
# of that number disagree.
#
# The recorded number is this repository's claim about an EXTERNAL producer.
# Nothing deterministic can tell whether it is still true; the scheduled Obico
# tier is what reconciles it against a live Obico.
source = "crates/printobserver-server/src/config.rs"
default_constant = "DEFAULT_INGRESS_ANSWER_BOUND_MS"
timeout_constant = "OBICO_POSTING_TIMEOUT_MS"
# The block in `AGENTS.md` recording the producer's timeout, its source and the
# fact that its posting does not retry.
timeout_block = "obico-posting-timeout"
# The section of `AGENTS.md` that records the bound: why it is where it is, and
# what reconciles the recorded timeout against a live Obico.
section = "The Obico ingress answer bound"
# The lines the block must carry, so a recording cannot lose its provenance.
required_block_keys = ["posting timeout", "source", "release", "retries"]

[service]
# The service this repository installs. NEITHER of these is declared here: the
# unit's name and the installer's path are read out of `AGENTS.md`'s
# "The end-user install path" section, which is the authoritative source of both,
# and `just check-repo` holds the tree to what that section states. What is
# declared here is where the installer writes the unit, and the fact that it must
# start nothing.
unit_directory = "/etc/systemd/system"
# Programs the installer may not invoke. Installing must not, as a side effect,
# start a process that can move a 3D printer, so the installer names the command
# that starts the service only in what it prints.
may_not_invoke = ["systemctl", "service", "systemd-run"]
# The configuration template the installer writes grants each actor class a set
# of actions, and those names are the CONTRACTS' vocabulary rather than this
# script's. `just check-repo` reads the generated action schema
# (`supervisor.action_schema`) and refuses a template naming an action the
# contracts do not declare, so a vocabulary that moves cannot leave an installed
# configuration granting something that no longer exists.
granting_table = "[safety.actions]"

[crates]
# The roles the dependency rule is stated in terms of. `just check-repo`
# enforces: core may depend on the type crate and the four ports and on no
# implementation crate; no implementation crate may depend on another.
types = "printobserver-types"
ports = [
    "printobserver-printer-api",
    "printobserver-vision-api",
    "printobserver-supervisor-api",
    "printobserver-store-api",
]
implementations = [
    "printobserver-octoprint",
    "printobserver-obico",
    "printobserver-oneharness",
    "printobserver-store-sqlite",
]
core = "printobserver-core"
# The only crates allowed to name an implementation: something has to choose
# which one runs.
composition_roots = ["printobserver-server", "printobserver"]
clients = ["printobserver-sdk"]
# The command-line program, and the two edges it may not have.
#
# It is a composition root — it starts the server — so the rule above permits
# it any implementation. What it must not have is either **vendor** adapter: for
# everything but starting the server it is a client of an already-running one,
# and a client that could name the printer's adapter or the failure detector's
# could reach a printer without the supervisor in between. That is the one thing
# this program exists to make impossible, so the edge is refused here rather
# than left to a reader.
cli = "printobserver"
# What it must depend on: the server it starts, and the typed client of the
# surface it talks to.
cli_requires = ["printobserver-server", "printobserver-sdk"]
# What it must not, whatever layer they sit in.
cli_forbids = ["printobserver-octoprint", "printobserver-obico"]

[supervisor]
# The one implementation of the supervisor port, and the artifacts it is held
# to. `just check-repo` refuses a source of this crate that uses a
# process-spawning interface at all, a schema file this crate carries of its
# own, and a prompt template naming an operation of this program beside the one
# read.
adapter = "printobserver-oneharness"
prompt_template = "crates/printobserver-oneharness/assets/turn-prompt.md"
skill = "crates/printobserver-oneharness/assets/printobserver-skill.md"
# The generated assessment schema's own checked-in artifact: written by the
# contracts' generation target, which refuses the tree when it no longer matches
# the types. It is the only schema the agent's answer may be constrained by.
assessment_schema = "schemas/printobserver-types/AgentAssessment.json"
# The generated action vocabulary. The set of operations the prompt template may
# not name is DERIVED from this file rather than restated here, so a variant
# `PrintAction` gains enters that set the moment the generation target writes
# it and the walk cannot fall behind the type.
action_schema = "schemas/printobserver-types/PrintAction.json"
# The program whose operations the template may not name, and the reads this
# system exposes beside the action vocabulary. `context_read` is the one
# operation the template may name, because it is a read.
program = "printobserver"
reads = ["status", "context", "image", "materialize", "history", "manifest-get", "manifest-set"]
context_read = "context"
# The lock the checked-in schema tree is read and written under, and every
# suite that takes it. One journey in the adapter's suite CHANGES a checked-in
# schema on disk — which is what proves the port reads that artifact at run
# time rather than validating against a copy of its bytes — and every suite
# that reads that tree runs at the same time under `nx run-many`. Both sides
# take this lock, and `just check-repo` holds every holder to this one name:
# two suites locking two different files are back to no lock at all.
schema_lock = "printobserver-schemas.lock"
schema_lock_holders = [
    "crates/printobserver-types/tests/schemas.rs",
    "crates/printobserver-oneharness/tests/supervision/support.rs",
]

[octoprint]
# The one crate that may know what an OctoPrint is. Everything above
# `printobserver-octoprint` is written as though printers were normal, and the
# moment a second crate constructs an OctoPrint request there are two places a
# vendor's own vocabulary has to be kept right — which is the coupling the port
# exists to remove. `just check-repo` reads every Rust source under `crates/`
# other than this crate's and refuses a line carrying one of the markers below.
#
# A comment-only line is exempt, so a crate may *say* `/api/job` while no crate
# but this one may *build* one.
crate = "printobserver-octoprint"
# What constructing an OctoPrint request looks like in a Rust source: the header
# OctoPrint authenticates by, and the paths this port speaks to. These are
# OctoPrint's own surface rather than this system's; a crate that wanted one of
# these spellings for a route of its own would be reconciling with this list
# deliberately rather than colliding with it silently.
request_markers = [
    "X-Api-Key",
    "/api/printer",
    "/api/job",
    "/api/files",
    "/api/connection",
    "/api/version",
    "/api/settings",
]

[manifests]
# The only manifests permitted to carry a version field, because release
# automation writes every one of them. A version anywhere else is one a person
# would have to hand-maintain, which is the thing Conventional-Commit-driven
# releasing exists to remove.
automation_owned = ["Cargo.toml", "crates/*/Cargo.toml"]

[commits]
# The Conventional Commit types release automation releases from. This set and
# `release-plz.toml`'s `release_commits` regex are checked against each other,
# and the committed `commit-msg` hook rules on the same set — a repository whose
# own hook refuses the titles its own plan publishes under is a defect that has
# already fired once in this plan's history.
release_types = ["feat", "fix", "perf"]
# Types that are valid subjects but do not cut a release.
non_release_types = ["docs", "test", "chore", "ci", "refactor", "build", "style", "revert"]

[workflows]
# `uses:` must name a tag of the form `@v<major>` or `@v<major>.<minor>.<patch>`.
# A branch ref (`@main`) is not a pin: it re-points under the repository without
# a commit here.
action_pin_pattern = '^[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@v[0-9]+(\.[0-9]+\.[0-9]+)?$'
# The kinds of job whose behaviour depends on the platform, and so the only kinds
# that may carry a platform matrix. A job's kind is what its own steps run, not
# what it is called. `just check-repo` holds these to AGENTS.md's
# supported-platform list and refuses a platform matrix on any other job.
platform_dependent_kinds = ["gate", "integration", "install"]
# The install script the `sdks` node commits, and the path the install-path
# section's fetch URL must name.
install_script_path = "scripts/install.sh"
install_service_script_path = "scripts/install-service.sh"

[agent]
# The narrow command allowlist. `just check-repo` derives the set of programs
# this repository's own recipes and graph targets invoke and requires the
# allowlist to name exactly that set — no command missing, none beyond it.
allowlist = ".claude/settings.json"

[toolchain]
# The tools `just install-tools` puts on PATH when they are missing. A release
# workflow may only run a program named here: a workflow naming a program
# nothing installs is a release that fails after a merge.
[[toolchain.tool]]
command = "cargo-nextest"
install = "cargo install cargo-nextest --locked"

[[toolchain.tool]]
command = "cargo-llvm-cov"
install = "cargo install cargo-llvm-cov --locked"

[[toolchain.tool]]
command = "release-plz"
install = "cargo install release-plz --locked"

[docs]
# The agent-facing documentation: one skill and the reference documents it
# links to.
#
# The skill is what OneHarness sends as every supervision turn's SYSTEM PROMPT,
# so its length is paid on every turn of every print. The two bounds below are
# the whole of what it is allowed to be, and they are two rather than one
# because a single very long line satisfies a line count and a wall of short
# lines satisfies a character count. `just check-repo` holds the committed skill
# to both, refuses reference material in it whatever form that material takes,
# refuses a link to a document that is not there, and refuses a skill that omits
# a link to one of the documents declared below.
skill = "crates/printobserver-oneharness/assets/printobserver-skill.md"
skill_max_characters = 6000
skill_max_lines = 150

# The generated artifacts the documentation checks read the things they
# inventory off, rather than reading a list somebody maintains.
#
# `surface_manifest` is written by the `printobserver:docs-surface` target from
# this program's own `surface()`; `schema_document` is written by
# `repo-check docs-schemas-write` from the schema tree the contracts' own
# generation target writes and gates. Neither is edited by hand.
surface_manifest = "docs/reference/surface.json"
schema_document = "docs/reference/schemas.md"
schema_directory = "schemas"

# What carries the reference documents into the built artifact, and the
# directory the skill links to them under.
#
# The skill links out for everything it does not say itself, and an install that
# carried the skill and none of what it points at would hand the agent dead
# links. So the documents are `include_str!`-ed into the adapter that ships the
# skill and written beside it on an installed host. `just check-repo` holds that
# array to the documents declared below, in both directions, resolving both
# sides on the filesystem — `crates/printobserver-oneharness/assets/reference`
# is this repository's own `docs/reference`, so a document is bundled by being
# the document rather than by being spelled the same way.
bundle_source = "crates/printobserver-oneharness/src/lib.rs"
bundle_assets = "crates/printobserver-oneharness/assets"
bundle_directory = "reference"

# Where a documented example is run from, so a reader copying one runs what this
# repository ran. `console` is the fence, `$ ` opens a command line, and the
# lines after it are what that command printed.
example_fence = "console"

# The nine things the skill must carry IN ITS OWN TEXT. Every other rule about
# the skill is about what it may not carry; these are what it owes. A skill that
# is short enough, holds no reference material and links correctly is refused
# unless every marker below is in it, because the skill is the whole of what the
# agent is given before it starts reading — a workflow step left to a linked
# document is one the agent meets after it has already decided what to do.
[[docs.skill_element]]
name = "the supervisory role"
marker = "## The role you are in"

[[docs.skill_element]]
name = "the safety boundaries"
marker = "## The boundaries you work inside"

[[docs.skill_element]]
name = "the statement that nothing sends a command to the printer"
marker = "no path in this system sends a command to the printer"

[[docs.skill_element]]
name = "the escalation path"
marker = "## When to escalate instead"

[[docs.skill_element]]
name = "the workflow step that reads the context"
marker = "1. **Read the context.**"

[[docs.skill_element]]
name = "the workflow step that inspects the image"
marker = "2. **Look at the image.**"

[[docs.skill_element]]
name = "the workflow step that decides"
marker = "3. **Decide.**"

[[docs.skill_element]]
name = "the workflow step that acts with a reason"
marker = "4. **Act, and say why.**"

[[docs.skill_element]]
name = "the workflow step that records what was seen"
marker = "5. **Record what you saw.**"

# Every reference document this repository declares, with the headings each one
# owes. A heading declared here and absent from the document is a failing check
# rather than something a reader notices, and the document's own opening
# coverage statement is held to the headings it actually carries.
[[docs.document]]
path = "docs/reference/command-surface.md"
headings = [
    "What a command is made of",
    "The four global options",
    "The exit statuses",
    "The commands",
]

[[docs.document]]
path = "docs/reference/api-and-clients.md"
headings = [
    "The one versioned prefix",
    "How a request is authenticated",
    "The operations",
    "The clients",
]

[[docs.document]]
path = "docs/reference/architecture.md"
headings = [
    "The crates",
    "Why core names no implementation crate",
    "Why the agent reaches this system the way an operator does",
]

[[docs.document]]
path = "docs/reference/schemas.md"
headings = ["The schema set", "The schemas"]

[[docs.document]]
path = "docs/reference/common-operations.md"
headings = ["Before you start", "The worked examples"]

[[docs.document]]
path = "docs/reference/testing.md"
headings = [
    "The tiers the gate runs",
    "The tiers outside the gate",
]

[[docs.document]]
path = "docs/reference/intervention-policy.md"
headings = [
    "Where the bounds come from",
    "What a rejection carries",
    "How a bounded intervention is restored",
    "What expiry does when no prior value was available",
]
