# The machine-readable half of this repository's own rules.
#
# `AGENTS.md` is the prose half and is authoritative for the things a reader
# needs in prose — the supported platforms, the merge model, the end-user
# install path. This file holds the facts a check needs to be deterministic
# about, so that no check has to guess and no rule is stated twice.
#
# `just check-repo` reads this file. `uv run -q repo-check --help` lists the
# individual checks.

schema_version = 1

[repository]
owner = "nickderobertis"
name = "printobserver"
base_branch = "main"

[gate]
# Every tier `just check` must invoke, the end-to-end tier included. `just
# check-repo` refuses a `check` recipe that omits one of these, and refuses any
# recipe in the set whose body would run nothing.
tiers = [
    "format-check",
    "lint",
    "typecheck",
    "test",
    "coverage",
    "build",
    "lint-workflows",
    "check-repo",
    "test-e2e",
]

[gate.coverage]
# Line-coverage floors. 95% is the create-repo default and nothing here lowers
# it. Each ecosystem measures its own suite and fails its own build below the
# floor; there is no combined cross-language number, because a single blended
# figure lets one language's coverage pay for another's.
rust = 95
python = 95
typescript = 95

# One platform whose Rust toolchain cannot read the profiles its own
# instrumentation writes. The gate there still builds, lints and runs every
# Rust test and journey natively, uninstrumented where instrumentation is what
# fails; the floor holds on every platform whose profiles are readable. An
# exemption names the platform's own Rust target and no other, the toolchain
# release, the exact refusal text, and an upstream issue describing that
# refusal on that target — `repo_checks.commands.coverage` refuses one that
# names no reference or another target. Removed when that toolchain produces
# readable profiles.
[gate.coverage.exemptions.windows-aarch64]
target = "aarch64-pc-windows-msvc"
toolchain = "rustc 1.97.1 and its bundled llvm-profdata"
diagnostics = ["malformed instrumentation profile data: symbol name is empty", "no profile can be merged"]
reference = "https://github.com/rust-lang/rust/issues/150123"

[llmlint]
# The judged-lint tier. Like the two tiers below it declares a `tier` recipe,
# which is what the documentation check reads every tier outside the gate off —
# so this tier is inventoried by being declared here rather than by a check
# knowing its name.
#
# It is deliberately NOT one of `gate.tiers`: it is non-deterministic and needs
# a harness credential, and a gate that could not run without one would stop
# being the deterministic gate. So it is a continuous-integration job of its
# own, in the workflow named below, and `just check-repo` refuses a gate job
# that runs it.
#
# `validate` is its deterministic half, which the job runs first so that a
# config, plugin or suppression slip fails without spending a harness call;
# `whole_tree` is the same judge over the tree rather than over a diff, which
# nothing in continuous integration runs.
tier = "lint-llm-diff"
validate = "lint-llm-validate"
whole_tree = "lint-llm"
setup = "setup-llmlint"
workflow = "ci.yml"

[suppressions]
# The ONE way to suppress a diagnostic in this repository. Every suppression
# directive in the tree needs an entry here naming the rule, the file, the site
# and a non-empty reason; `just check-repo` refuses a directive without one, an
# entry without a reason, and an entry that matches nothing.
allowlist = "suppressions.toml"

# The only rules a WHOLE-FILE directive may name, and the narrowest the
# exception can be made.
#
# Every deterministic linter and type checker here attributes each finding to a
# line, so a whole-file directive from one of them is always broader than the
# finding it answers, and `just check-repo` refuses it with no exception at all.
# llmlint is the one tool with rules that are about a file as a whole — whether
# a script's output is signal, whether its inputs are validated — and for those
# a whole-file directive is the only shape that fits.
#
# The permission is llmlint's alone and reaches only the rules named here; a
# directive naming any other rule is refused, and every use still needs its own
# entry in the allowlist above, with a reason. Adding a name to this list is a
# deliberate, reviewable change rather than something a directive can do for
# itself.
whole_file_rules = ["tool_output_is_signal", "boundary_inputs_validated"]

[platforms]
# The platform record, and the two copies of a platform fact that live in
# languages which cannot import the declaration they come from.
#
# `AGENTS.md`'s supported-platform list declares WHICH platforms there are, and
# `tools/repo-checks/src/repo_checks/platforms.py` declares what each of them is
# CALLED — the JavaScript registry's own selectors, the program's file name, the
# release asset's name, and how a wheel's platform tag is spelled. Everything
# else in the tree that states one of those reads it from there. These two
# cannot: a `.mjs` the JavaScript registry installs and a TOML file rustup reads
# are the two places a copy has to be written out, and `just check-repo`'s
# `platform-facts` is what holds each of them to its source.
#
# The third copy — the install script's own `uname` arms — is deliberately NOT
# named here: which scripts route 3 has behind it is read out of the fetch
# commands `AGENTS.md`'s install-path section states, so a script added or
# replaced there is found by being that route's own rather than by being listed
# twice.
launcher = "npm/printobserver-cli/bin/printobserver.mjs"
# Bound ONE WAY: every Rust target this file installs must be one the
# supported-platform list names, and it is not required to name them all. The
# array is about what a BUILD HOST installs, not about what each platform's own
# runner builds natively — six standard libraries on every runner would be
# waste, and a rule requiring all of them would mandate it.
toolchain = "rust-toolchain.toml"

# A platform the supported-platform list once named and names no longer, with
# the reason it was cut. The two checks that refuse the list narrowing against
# the commit a change was cut from — `install-path-not-narrowed` and
# `integration-tier` — admit a platform recorded here and no other, so a
# platform cannot leave the list quietly: the cut is visible, reasoned, and
# refused without both. A record naming a platform the list still carries is
# refused too, because it would say the platform was cut while it was not.
[[platforms.retired]]
id = "macos-x86_64"
reason = "cut on 2026-09-18 for hosted-runner cost: the account holds five concurrent macOS slots shared with other work, and one push here was starting sixteen macOS jobs. Apple silicon is the only macOS platform."

[integration]
# The printer integration tier, and the two recipes that bracket it. These
# names are the one source: `just check-repo` holds the committed
# continuous-integration job to them, so a job that ran something other than
# this repository's own recipes, or omitted the bring-up or the bring-down, is
# refused. The tier is deliberately not one of `gate.tiers`: it installs
# OctoPrint, starts it and waits a print out, so it is a job of its own rather
# than something every gate run pays for.
tier = "test-integration"
bring_up = "octoprint-up"
bring_down = "octoprint-down"
# The block in `AGENTS.md` recording the platforms the virtual printer is
# unavailable on, each with its reason. Empty today; the integration job's
# matrix is the supported-platform list minus whatever it names.
exclusions_block = "virtual-printer-exclusions"

[obico]
# The scheduled Obico tier, and the two recipes that bracket it. These names are
# the one source: `just check-repo` holds the committed workflow to them, so a
# workflow that ran something other than this repository's own recipes, or
# omitted the bring-up or the bring-down, is refused.
#
# The tier is deliberately not one of `gate.tiers` and `just check-repo` refuses
# a tree in which it is: it builds Obico's own images, starts four containers
# including a machine-learning service, and waits a real failure alert out, so it
# is minutes of startup that every gate run would otherwise pay for. It runs on a
# schedule instead, which is what `triggers` below is about.
tier = "test-obico"
bring_up = "obico-up"
bring_down = "obico-down"
workflow = "obico.yml"
# The ONLY triggers that workflow may carry. A schedule it names and a manual
# invocation, and nothing that fires on a change: a tier this expensive that ran
# on every push would be the gate again under another name.
triggers = ["schedule", "workflow_dispatch"]
# The block in `AGENTS.md` recording the schedule the tier runs on. It and the
# workflow's own `cron` entries are checked against each other, so a schedule
# recorded in prose cannot drift from the one that actually fires.
schedule_block = "obico-tier-schedule"
# The section of `AGENTS.md` that records the tier: what it proves, why it is not
# in every run, and how to run it by hand.
section = "The scheduled Obico tier"

[install_proof]
# The registry install-path proof: the tier that takes each of the three
# end-user routes from its own registry and runs what it installed.
# `AGENTS.md`'s "The registry install-path proof" is the prose half, and the
# judgment behind how this tier is keyed is with the project that carries it, at
# `tools/release-artifacts/AGENTS.md`; what is declared here is what a check has
# to be deterministic about.
#
# Like the two tiers above it declares a `tier` recipe, which is what the
# documentation check reads every tier outside the gate off — so this tier is
# inventoried by being declared here rather than by a check knowing its name.
#
# It is deliberately NOT one of `gate.tiers` and `just check-repo` refuses a
# tree in which it is: it reads the real package registries, so over a change
# it could only ever report what was published before that change and could
# say nothing at all about the artifact under review.
tier = "test-install-proof"
# The recipes that prove one route each. Declared as a prefix rather than as
# three names, because which route each one proves is read out of the recipe's
# own body — the target it names — and held against the routes `AGENTS.md`
# states.
recipe_prefix = "prove-registry-"
workflow = "install-path.yml"
# The ONLY triggers that workflow may carry. A release's own proof, a schedule
# and a manual invocation, and nothing that fires on a change.
triggers = ["workflow_run", "schedule", "workflow_dispatch"]
# The workflow whose FINISHING is the release-time trigger. Not the GitHub
# Release being published: that release is cut in the `release` job and the
# artifacts are built and published in the two jobs after it, so a proof keyed
# on the release itself would measure the version before it.
release_workflow = "release-plz"
# The job that resolves WHICH release a release-time run proves, the output it
# publishes that version under, and the recipe it answers it with. `just
# check-repo` composes the rest from these three rather than restating them: the
# gate every other job must carry, and the version under test every job proving
# a route must take — so the three routes cannot resolve three different
# releases between them, and a run that cut nothing proves nothing rather than
# proving whatever a registry served newest.
#
# Deliberately NOT the triggering run's conclusion. A run that cut its release
# and then failed to publish the artifacts concludes as a failure, so a
# conclusion gate skips exactly the state this tier exists to find and the
# publish that did not happen is reported by nothing at all; gated on the
# release itself that run is proven and answers `NOT SERVED`.
release_job = "resolve"
release_output = "version"
release_recipe = "release-version"
# How the version under test reaches the tier, the input a caller names it in,
# and the word that means "the newest release the forge published". The
# committed tree's own version is deliberately not among them.
version_env = "PRINTOBSERVER_PROOF_VERSION"
version_input = "version"
release_selector = "release"
# And the environment the forge's own release listing is read under. The forge
# meters an anonymous read of its API by the CALLER'S ADDRESS, which every
# hosted cell of this tier shares, so a run of it met `403 rate limit exceeded`
# before proving a route. The workflow's own token is what answers that — it is
# not a secret `gh-secrets.json` declares, and needs not be: the read is
# authenticated for the quota rather than for the access.
#
# Declared here for the same reason the two variables above are: the workflow
# sets it, the module below reads it, and nothing else would reconcile the two.
# `just check-repo` requires that module to declare this literal and every job
# proving a route to set it to the expression below.
forge_token_env = "GITHUB_TOKEN"
# What that job must set it to — the whole expression, `${{ <this> }}`, with
# its spacing taken out. The workflow's own token, spelled as the token rather
# than as `secrets.GITHUB_TOKEN`, because that spelling is a secret reference
# and `gh-secrets.json` is the whole of what this repository holds. Held to the
# whole expression rather than to what one contains, because `${{ github.token
# || secrets.ANY }}` contains it and reads the forge as a credential nobody
# declared.
forge_token_expression = "github.token"
# The constant the module below declares that word as. The constant is NAMED
# here rather than the word searched for, because `"release"` is also the
# registry a forge listing is read from in that same module: a check hunting the
# bare literal would find one of those and pass over a selector renamed out from
# under this declaration.
selector_constant = "RELEASE"
# Where every registry is read from when nothing points them elsewhere, and the
# module that reads the two variables and declares the selector. `just
# check-repo` holds that module's own literals to the three names above, so the
# workflow that sets one, this declaration, and the code that reads them cannot
# drift apart — which the workflow-against-policy check alone would not catch.
standin_env = "PRINTOBSERVER_PROOF_REGISTRIES"
version_source = "tools/release-artifacts/src/release_artifacts/registries.py"
# The block in `AGENTS.md` recording the schedule the tier runs on.
schedule_block = "install-proof-schedule"
# The section of `AGENTS.md` that records the tier: what it proves, why it is
# not in every run, and how to run it by hand.
section = "The registry install-path proof"

[ingress]
# The Obico ingress answer bound, and the producer's own timeout it must stay
# below. `just check-repo` reads the shipped default and the server's own copy of
# the producer's timeout out of the source below, reads the recorded timeout out
# of AGENTS.md's block, and refuses a tree in which the default is not below the
# recorded timeout, in which no timeout is recorded, or in which the two copies
# of that number disagree.
#
# The recorded number is this repository's claim about an EXTERNAL producer.
# Nothing deterministic can tell whether it is still true; the scheduled Obico
# tier is what reconciles it against a live Obico.
source = "crates/printobserver-server/src/config.rs"
default_constant = "DEFAULT_INGRESS_ANSWER_BOUND_MS"
timeout_constant = "OBICO_POSTING_TIMEOUT_MS"
# The block in `AGENTS.md` recording the producer's timeout, its source and the
# fact that its posting does not retry.
timeout_block = "obico-posting-timeout"
# The section of `AGENTS.md` that records the bound: why it is where it is, and
# what reconciles the recorded timeout against a live Obico.
section = "The Obico ingress answer bound"
# The lines the block must carry, so a recording cannot lose its provenance.
required_block_keys = ["posting timeout", "source", "release", "retries"]

[service]
# The service this repository installs, one installer per service manager the
# supported-platform list names a pair of commands for. The service's name is
# NOT declared here: it is read out of `AGENTS.md`'s "The end-user install
# path" section, off each manager's own activation command, which is the
# authoritative source of it, and `just check-repo` holds each installer to what
# that section states under its manager.
#
# The configuration template every installer writes grants each actor class a
# set of actions, and those names are the CONTRACTS' vocabulary rather than the
# script's. `just check-repo` reads the generated action schema
# (`supervisor.action_schema`) and refuses a template naming an action the
# contracts do not declare, so a vocabulary that moves cannot leave an installed
# configuration granting something that no longer exists.
granting_table = "[safety.actions]"

# One table per service manager, keyed by the manager's own name as the
# supported-platform list spells it. `installer` is the committed script the
# manager's pair fetches. `may_not_invoke` are the programs it may not run and
# `may_not_set` the settings it may not write: installing must not, as a side
# effect, start a process that can move a 3D printer — at install or at the
# next boot — so the installer names the command that starts the service only
# in what it prints. `starts_at_boot` and `restarts_after_crash` are, in the
# manager's own vocabulary, what makes the installed service unattended: the
# second is in the registration the installer writes, and the first is there
# too, or in the operator's own activation command where the manager has no
# way to declare it without enabling it.
[service.managers.systemd]
installer = "scripts/install-service.sh"
# Where the installer writes the unit: the directory the manager reads units from.
registration_directory = "/etc/systemd/system"
may_not_invoke = ["systemctl", "service", "systemd-run"]
starts_at_boot = "WantedBy=multi-user.target"
restarts_after_crash = "Restart=on-failure"

# launchd loads every property list under this directory at boot, and starts
# the ones that say `RunAtLoad`; `KeepAlive` with `SuccessfulExit` false brings
# one back after its process ends abruptly and leaves one that exited cleanly
# down. The installer writes both into the property list and loads nothing: the
# activation command's `bootstrap` is what loads it.
[service.managers.launchd]
installer = "scripts/install-service.sh"
registration_directory = "/Library/LaunchDaemons"
may_not_invoke = ["launchctl"]
starts_at_boot = "<key>RunAtLoad</key> <true/>"
restarts_after_crash = "<key>KeepAlive</key> <dict> <key>SuccessfulExit</key> <false/> </dict>"

# The service control manager keeps no declaration apart from its record, and a
# registration reading `start= auto` is one it starts at the next boot whether
# or not anybody ran the second command. So the installer registers the
# service on demand, and `-StartupType Automatic` is the activation command's.
[service.managers.windows-service]
installer = "scripts/install-service.ps1"
may_not_invoke = [
    "Start-Service",
    "Set-Service",
    "Restart-Service",
    "Resume-Service",
    "New-Service",
    "Start-Process",
    "sc.exe start",
    "sc start",
    "net start",
    "net.exe start",
]
may_not_set = ["start= auto", "start= delayed-auto", "start= boot", "start= system"]
starts_at_boot = "-StartupType Automatic"
restarts_after_crash = "actions= restart"
# Where the program carries its own copy of the service's name, for the manager
# to dispatch by: held to the name the pair states, like the installer's.
program_source = "crates/printobserver/src/windows_service.rs"
program_constant = "SERVICE_NAME"

[skill_install]
# The real `gh skill install` of this repository's Agent Skill, from a copy of
# the tree and with no GitHub credentials. Like the tiers above it declares a
# `tier` recipe, which is what the documentation check inventories every tier
# outside the gate by. It is deliberately NOT one of `gate.tiers`: it needs
# GitHub CLI at the release `[[toolchain.tool]]` holds `gh` at, which is not
# bootstrapped on the gate's runners, so it is the `skill-install` job of
# `.github/workflows/ci.yml` alone, on every change. The layout it proves is
# held on every platform, inside the gate, by `docs-skill-directory` and
# `docs-link-symlinks`.
tier = "test-skill-install"

[smoke]
# The real-printer smoke test: the one thing here that drives a machine capable
# of destroying itself, and so the one thing nothing may select automatically.
# `AGENTS.md`'s "The real-printer smoke test" is the prose half; what is
# declared here is what a check has to be deterministic about.
#
# Two inputs together select it and one alone does not: the variable below,
# naming the serial device explicitly, and the flag below, given to the recipe.
script = "tools/printer-smoke/printer_smoke.py"
recipe = "test-printer-smoke"
flag = "--run"
device_env = "PRINTOBSERVER_SMOKE_DEVICE"
suite = "tools/printer-smoke/tests"
section = "The real-printer smoke test"

# The payload it prints, and the closed set of commands that file may contain.
# The set is declared HERE rather than in the check that enforces it: a check
# choosing its own safe set could call a dangerous command safe. Everything
# outside it is excluded by construction, which is how the firmware writes
# (`M500`, `M502`), the calibration routines (`M303`, `G29`) and the emergency
# stop (`M112`) stay out — none of them is on a list of its own.
gcode = "tools/printer-smoke/gcode/smoke.gcode"
safe_commands = [
    "G21",
    "G90",
    "G91",
    "G92",
    "G28",
    "G0",
    "G1",
    "M82",
    "M83",
    "M104",
    "M109",
    "M140",
    "M190",
    "M106",
    "M107",
    "M84",
]
# Short enough that a person reads the whole payload before it reaches a
# machine, and long enough for an object with real perimeters.
max_lines = 200

[crates]
# The dependency rule, stated as the edges it admits rather than as layers.
#
# `may_depend_on` below names, for every workspace crate, the workspace crates
# it may depend on — across `dependencies`, `dev-dependencies` and
# `build-dependencies`, and exactly the crate table AGENTS.md's "The dependency
# rule" points at. `may_depend_on_in_tests` names the few edges a crate's tests
# may add under `dev-dependencies` alone: a runtime or build dependency on one
# of those is refused exactly as an edge no row admits. `just check-repo`
# refuses a manifest edge the rows do not admit, a row naming a crate the
# workspace does not hold, and a workspace crate with no row: the step that
# draws an edge is the step that admits it here, so the check proves the graph
# rather than a rule about it.
#
# The crates the other checks name by role. `core` is the supervision domain,
# whose stated dependency direction the architecture document is held to;
# `clients` are the generated clients the API document inventories.
core = "printobserver-core"
clients = ["printobserver-sdk"]
# The command-line program, and the two edges it may not have.
#
# The table already admits it the server and the client alone; these two say
# *why* the edges it must not have are the two vendor adapters, so that a
# reader of a refusal is told the reason rather than the row. For everything
# but starting the server it is a client of an already-running one, and a
# client that could name the printer's adapter or the failure detector's could
# reach a printer without the supervisor in between. That is the one thing
# this program exists to make impossible.
cli = "printobserver"
# What it must depend on: the server it starts, and the typed client of the
# surface it talks to.
cli_requires = ["printobserver-server", "printobserver-sdk"]
# What it must not, whatever the table said.
cli_forbids = ["printobserver-octoprint", "printobserver-obico"]

# The four properties the graph is drawn for read straight off the rows: the
# type crate sits under every crate and depends on nothing; each port depends
# on the type crate alone; the supervision domain depends on the type crate
# and the three ports and on no adapter or store, which is what keeps the
# graph acyclic; and every adapter and the store are reached by the
# composition roots — `printobserver-server`, and through it the command —
# and by nothing else.
[crates.may_depend_on]
"printobserver-types" = []
"printobserver-printer-api" = ["printobserver-types"]
"printobserver-vision-api" = ["printobserver-types"]
"printobserver-supervisor-api" = ["printobserver-types"]
"printobserver-core" = [
    "printobserver-types",
    "printobserver-printer-api",
    "printobserver-vision-api",
    "printobserver-supervisor-api",
]
"printobserver-octoprint" = ["printobserver-printer-api", "printobserver-types"]
"printobserver-obico" = ["printobserver-vision-api", "printobserver-core", "printobserver-types"]
"printobserver-oneharness" = ["printobserver-supervisor-api", "printobserver-types"]
"printobserver-store-sqlite" = [
    "printobserver-core",
    "printobserver-supervisor-api",
    "printobserver-printer-api",
    "printobserver-types",
]
"printobserver-server" = [
    "printobserver-types",
    "printobserver-printer-api",
    "printobserver-vision-api",
    "printobserver-supervisor-api",
    "printobserver-core",
    "printobserver-octoprint",
    "printobserver-obico",
    "printobserver-oneharness",
    "printobserver-store-sqlite",
]
"printobserver-sdk" = []
"printobserver" = ["printobserver-server", "printobserver-sdk", "printobserver-types"]

# The edges a crate's tests may add, under `dev-dependencies` and no other
# table. The command's journeys seed a state directory — a print, an event, an
# image — before starting a server on it, through the real SQLite store and the
# supervision domain's own store traits, because a print record is minted by
# the supervisor and no client command opens one; the program itself reaches
# the store only through the server it starts, and this table does not let it
# reach either crate at run time.
[crates.may_depend_on_in_tests]
"printobserver" = ["printobserver-core", "printobserver-store-sqlite"]

[supervisor]
# The one implementation of the supervisor port, and the artifacts it is held
# to. `just check-repo` refuses a source of this crate that uses a
# process-spawning interface at all, a schema file this crate carries of its
# own, and a prompt template naming an operation of this program beside the one
# read.
adapter = "printobserver-oneharness"
prompt_template = "crates/printobserver-oneharness/assets/turn-prompt.md"
skill = "skills/printobserver/SKILL.md"
# The generated assessment schema's own checked-in artifact: written by the
# contracts' generation target, which refuses the tree when it no longer matches
# the types. It is the only schema the agent's answer may be constrained by.
assessment_schema = "schemas/printobserver-supervisor-api/AgentAssessment.json"
# The generated action vocabulary. The set of operations the prompt template may
# not name is DERIVED from this file rather than restated here, so a variant
# `PrintAction` gains enters that set the moment the generation target writes
# it and the walk cannot fall behind the type.
action_schema = "schemas/printobserver-core/PrintAction.json"
# The program whose operations the template may not name, and the reads this
# system exposes beside the action vocabulary. `context_read` is the one
# operation the template may name, because it is a read.
program = "printobserver"
reads = ["prints", "status", "context", "image", "materialize", "history", "manifest-get", "manifest-set"]
context_read = "context"
# The lock the checked-in schema tree is read and written under, and every
# suite that takes it. One journey in the adapter's suite CHANGES a checked-in
# schema on disk — which is what proves the port reads that artifact at run
# time rather than validating against a copy of its bytes — and every suite
# that reads that tree runs at the same time under `nx run-many`. Both sides
# take this lock, and `just check-repo` holds every holder to this one name:
# two suites locking two different files are back to no lock at all.
schema_lock = "printobserver-schemas.lock"
schema_lock_holders = [
    "crates/printobserver-supervisor-api/tests/schemas.rs",
    "crates/printobserver-oneharness/tests/supervision/support.rs",
    "tools/repo-checks/tests/treecopy.py",
]

[clients]
# Every byte-sequence field a shape this server ANSWERS may carry, each with
# the reason it may. `just check-repo`'s `response-shapes` walks every response
# shape the server declares — each declared field and each variant payload in
# turn — and refuses one it reaches that is not recorded here. A string
# declared as carrying image content is refused outright and has no exception:
# an image is a path on the server's own filesystem, and no answer of it
# carries the bytes.
#
# The point of walking rather than looking where an image would be is that a
# NEW byte-sequence field cannot appear in a response shape unnoticed.
[[clients.byte_sequence]]
type = "EventRecord"
field = "raw"
reason = """
The external producer's own body, recorded exactly as received so that an alert \
this system cannot read is written down rather than dropped. It is Obico's JSON \
notification rather than image content — Obico sends a snapshot as a URL — and \
the two types an image travels as, `ImageRecord` and `ImageRef`, declare no \
field of bytes at all.
"""

[octoprint]
# The one crate that may know what an OctoPrint is. Everything above
# `printobserver-octoprint` is written as though printers were normal, and the
# moment a second crate constructs an OctoPrint request there are two places a
# vendor's own vocabulary has to be kept right — which is the coupling the port
# exists to remove. `just check-repo` reads every Rust source under `crates/`
# other than this crate's and refuses a line carrying one of the markers below.
#
# A comment-only line is exempt, so a crate may *say* `/api/job` while no crate
# but this one may *build* one.
crate = "printobserver-octoprint"
# What constructing an OctoPrint request looks like in a Rust source: the header
# OctoPrint authenticates by, and the paths this port speaks to. These are
# OctoPrint's own surface rather than this system's; a crate that wanted one of
# these spellings for a route of its own would be reconciling with this list
# deliberately rather than colliding with it silently.
request_markers = [
    "X-Api-Key",
    "/api/printer",
    "/api/job",
    "/api/files",
    "/api/connection",
    "/api/version",
    "/api/settings",
]

[release]
# The two recipes release automation runs, and the only way a check tells one
# job from another. `build_recipe` builds every artifact `release-targets.toml`
# declares beside the crates — one build per platform AGENTS.md's own list
# names, because each of the three end-user routes carries the program already
# built for the platform. `publish_recipe` puts them where their consumers
# install them from.
#
# The credentials are deliberately NOT named here. Each registry's token is
# what the publishing tool reads from its environment, and `gh-secrets.json` is
# the authoritative list of what this repository holds; a name repeated here
# would be a second answer to a question that manifest already answers.
build_recipe = "build-artifacts"
publish_recipe = "publish-artifacts"
# How the two recipes above are gated. `release-plz release` exits zero having
# released nothing — every ordinary push, under `release_always` — while the
# Python and JavaScript registries refuse a version they already serve, so a
# build and a publish chained behind it unconditionally turn `main` red on the
# push after a release. The publishing job runs it with `--output json`, the
# recipe below reads that answer into the output below, and the jobs running
# the two recipes above are gated on that output being non-empty. `just
# check-repo`'s `release-gating` holds the workflow to these two names and the
# module that reads the answer to the output's, and refuses a publishing job
# that waits on the job drafting the next release's pull request: a drafting
# job that cannot draft must not be able to stop a publication that is ready.
answer_recipe = "release-answer"
answer_output = "released"
answer_source = "tools/release-artifacts/src/release_artifacts/registries.py"
# The second way the release workflow runs: dispatched by hand on `main` with
# the name of an EXISTING release tag, it builds that tag's tree's artifacts and
# publishes them with the publisher at the dispatched ref — the same jobs, the
# same publisher and the same secrets as a push, and nothing of the operator's.
# `dispatch_input` is the one input that dispatch takes. `dispatched_recipe`
# verifies the tag in the job above and answers the same `answer_output` field
# for it, so the two artifact jobs read one gate whichever way the run started;
# `record_recipe` reads the record it wrote, in the install-path proof's
# resolving job, and `record_artifact` is the name that record crosses between
# the two workflows under. `publish_version_env` is how the version to publish
# reaches the publish recipe on a dispatch, and `publish_version_source` is the
# module that reads it, held to this name as `install_proof.version_source` is
# to its. `just check-repo`'s `release-dispatch` holds both workflows, the
# recipe set and that module to these names.
dispatch_input = "tag"
dispatched_recipe = "release-dispatched"
record_recipe = "release-version-dispatched"
record_artifact = "dispatched-release"
publish_version_env = "PRINTOBSERVER_PUBLISH_VERSION"
publish_version_source = "tools/release-artifacts/src/release_artifacts/publishing.py"

[manifests]
# The only manifests permitted to carry a version field, because release
# automation writes every one of them. A version anywhere else is one a person
# would have to hand-maintain, which is the thing Conventional-Commit-driven
# releasing exists to remove.
automation_owned = ["Cargo.toml", "crates/*/Cargo.toml"]

[commits]
# The Conventional Commit types release automation releases from. This set and
# `release-plz.toml`'s `release_commits` regex are checked against each other,
# and the committed `commit-msg` hook rules on the same set — a repository whose
# own hook refuses the titles its own plan publishes under is a defect that has
# already fired once in this plan's history.
release_types = ["feat", "fix", "perf"]
# Types that are valid subjects but do not cut a release.
non_release_types = ["docs", "test", "chore", "ci", "refactor", "build", "style", "revert"]

[workflows]
# `uses:` must name a tag of the form `@v<major>` or `@v<major>.<minor>.<patch>`.
# A branch ref (`@main`) is not a pin: it re-points under the repository without
# a commit here.
action_pin_pattern = '^[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@v[0-9]+(\.[0-9]+\.[0-9]+)?$'
# The kinds of job whose behaviour depends on the platform, and so the only kinds
# that may carry a platform matrix. A job's kind is what its own steps run, not
# what it is called. `just check-repo` holds these to AGENTS.md's
# supported-platform list and refuses a platform matrix on any other job.
platform_dependent_kinds = ["gate", "integration", "install", "artifact"]
# The install scripts behind the install-path section's third route, one per
# family of platform — the shell one for Linux and macOS, the PowerShell one
# for Windows — and the paths that route's fetch commands may name. The service
# installers a fetch URL may name are `service.managers.<manager>.installer`.
install_script_paths = ["scripts/install.sh", "scripts/install.ps1"]

# The two commands after the routes are the ONLY steps of an install job whose
# failure does not fail it, and the price of that waiver is that the run says
# what they reached.
#
# Neither can succeed unattended: the installer resolves the program with
# `command -v` under a sudo `secure_path` that excludes where two of the three
# routes put it, and the unit will not start on a configuration template that
# ships an OctoPrint key and an ingress secret the server refuses as empty.
# Made fatal, the workflow fails on every run whatever the world looks like,
# which is how it went unread. Made non-fatal and unreported, a green job says
# nothing about whether the service was ever established — and a
# credential-dependent failure that nobody can see has disappeared.
#
# So `just check-repo` requires each of them to carry the step ids below — the
# one installer step the shell installer's managers share, and one start step
# per manager, plus the Windows pair the PowerShell installer is its own step
# of — and requires a step of that job to write EVERY one of their outcomes
# into the run's own summary. `outcome` and not `conclusion`:
# `continue-on-error` is what makes `conclusion` read `success` for a step that
# failed, so a report reading it would say every route's service came up every
# time.
waived_steps = [
  "install-service",
  "start-service-systemd",
  "start-service-launchd",
  "install-service-windows-service",
  "start-service-windows-service",
]
waived_report = "GITHUB_STEP_SUMMARY"

[dispatch]
# The workflow that runs ONE job of ONE source workflow on ONE supported
# platform, by hand, and no other job: the lever a platform is brought up with
# once its cells are in the gate, because a push re-runs every cell of every
# job to re-run one, and the hosted macOS runners are a handful of slots shared
# with other work.
#
# What turns its two inputs into a job and a runner, and what then runs that
# job's own `run:` steps off the committed source workflow, is the committed
# script `repo_checks.dispatching`, reached through the two recipes below —
# so a test drives it exactly as the workflow does, on a host that is not a
# runner. `just check-repo`'s `platform-dispatch` holds the workflow to that
# script: the trigger set is `workflow_dispatch` alone, its inputs are
# `job_input` and `platform_input` and nothing else, `platform_input`'s
# options are exactly the supported-platform list, `job_input`'s options are
# exactly the platform-matrixed jobs of `sources`, exactly one job runs
# `resolve_recipe` and publishes the runner it answered, exactly one other
# needs it, runs on that answer and runs `run_recipe`, and every source job is
# one the script can run by hand.
workflow = "platform-dispatch.yml"
job_input = "job"
platform_input = "platform"
sources = ["ci.yml", "install-path.yml"]
resolve_recipe = "dispatch-resolve"
run_recipe = "dispatch-run"

[agent]
# The narrow command allowlist. `just check-repo` derives the set of programs
# this repository's own recipes and graph targets invoke and requires the
# allowlist to name exactly that set — no command missing, none beyond it.
allowlist = ".claude/settings.json"

[toolchain]
# The tools `just install-tools` puts on PATH when they are missing. A release
# workflow may only run a program named here: a workflow naming a program
# nothing installs is a release that fails after a merge.
#
# A tool carrying `version` is held to that one release everywhere this
# repository runs it, and that field is the one place the release is written:
# `{version}` in its `install` is substituted from it; `just install-tools`
# replaces a copy on PATH that answers `--version` with any other release, and
# refuses one still answering another afterwards; and a workflow installing it
# prebuilt installs the release `just tool-version <command>` reads from here,
# which `just check-repo` requires of it. Unheld, the gate ran whichever release
# a cache restored and the release job whichever a registry served newest, so a
# journey proving one release-plz proved nothing about the one that releases.
#
# A tool carrying `bootstrap = false` is one job's rather than every host's:
# `just install-tools` — and so `just bootstrap` — leaves it alone, and `just
# install-tools <command>` installs it, and it alone, where that job needs it.
# Absent, `bootstrap` is `true`.
# The Windows target `just lint` runs clippy for on a Unix host, so a finding
# in the tree's `cfg(windows)` code is reported before a push rather than by a
# Windows runner two hours later. The GNU flavour rather than MSVC: it sees the
# same `cfg(windows)` code, and zig — obtained through `uv` from the `zig`
# dependency group — carries the mingw-w64 headers its C dependencies compile
# against, so the pass needs no cross toolchain installed on the host. `just
# bootstrap` adds the target's standard library on every host that is not
# Windows; where it is absent the pass says so and skips, and on a Windows host
# the native lint tier is that pass.
[toolchain.windows_lint]
target = "x86_64-pc-windows-gnu"
zig_target = "x86_64-windows-gnu"

[[toolchain.tool]]
command = "cargo-nextest"
install = "cargo install cargo-nextest --locked"

[[toolchain.tool]]
command = "cargo-llvm-cov"
install = "cargo install cargo-llvm-cov --locked"

# Held at the newest release on 2026-09-14. It reports a forge's refusal in a
# different shape from 0.3.164, the release the `0.2.0` run used, and
# `tests/repo-e2e/tests/test_release_tag_journey.py` records the shape this one
# prints: a bump re-reads that recording.
#
# Not bootstrapped, and taken PREBUILT. Only the release workflow and the three
# release journeys run it, and `cargo install` compiled it from source on every
# host that bootstrapped — about thirteen minutes on a cold Windows gate cell,
# for a program that cell runs in one tier. `just test-e2e` installs it by name,
# so the journeys that drive it never go silently skipped, and the release
# workflow installs it by name too. `repo_checks install-release-plz` verifies
# the archive against the SHA-256 this repository commits for that release and
# that target — upstream publishes no checksums file of its own — before
# anything reaches PATH.
[[toolchain.tool]]
command = "release-plz"
version = "0.3.167"
bootstrap = false
install = "uv run -q python -m repo_checks install-release-plz {version}"

# GitHub CLI, for the one journey that runs a real `gh skill install` of this
# repository's Agent Skill, held at the release that journey's behaviour was
# measured on — 2.100.0, the first with `gh skill`. Not bootstrapped: the gate's
# hosted runners carry a `gh` of their own, and replacing it on every cell would
# serve nothing there. The `skill-install` job installs this release through
# `repo_checks install-gh`, which verifies the release's own archive against its
# published checksums before anything reaches PATH.
[[toolchain.tool]]
command = "gh"
version = "2.100.0"
bootstrap = false
install = "uv run -q python -m repo_checks install-gh {version}"

# PowerShell, for the three end-to-end journeys that drive the committed
# PowerShell install script and the Windows service installer the way a caller
# on Windows runs them. Nothing used to declare or install it, so those journeys
# ran on Windows alone and a Linux or macOS development host proved that half of
# the install path not at all.
#
# `provided_by` is why a Windows host installs nothing: it carries `powershell`,
# which is what `release_artifacts.installing` runs a script under where `pwsh`
# is absent, and a host carrying a `pwsh` of its own is left alone too — neither
# is a copy this repository installed, so neither is one it holds at a release.
# Where a host carries neither, `repo_checks install-powershell` takes the
# release's own archive and verifies it against the `hashes.sha256` that release
# publishes before unpacking anything.
[[toolchain.tool]]
command = "pwsh"
version = "7.6.6"
provided_by = ["pwsh", "powershell"]
install = "uv run -q python -m repo_checks install-powershell {version}"

[docs]
# The agent-facing documentation: one Agent Skill and the reference documents
# it links to, all regular files in one directory, `skills/printobserver/`.
# `gh skill install nickderobertis/printobserver printobserver` installs exactly
# that directory and drops every symlink in it, and an installed server is
# pointed at the installed `SKILL.md` by `supervisor.skill_path` and runs the
# agent from beside it. So `just check-repo` refuses a symlink under the skill's
# directory and a link from it that leaves it, holds the skill's frontmatter to
# the Agent Skills rules, and measures everything below over the prose after
# that frontmatter — the part a turn sends.
#
# The skill is what OneHarness sends as every supervision turn's SYSTEM PROMPT,
# so its length is paid on every turn of every print. The two bounds below are
# the whole of what it is allowed to be, and they are two rather than one
# because a single very long line satisfies a line count and a wall of short
# lines satisfies a character count. `just check-repo` holds the committed skill
# to both, refuses reference material in it whatever form that material takes,
# refuses a link to a document that is not there, and refuses a skill that omits
# a link to one of the documents declared below.
skill = "skills/printobserver/SKILL.md"
skill_max_characters = 6000
skill_max_lines = 150

# The generated artifacts the documentation checks read the things they
# inventory off, rather than reading a list somebody maintains.
#
# `surface_manifest` is written by the `printobserver:docs-surface` target from
# this program's own `surface()`; `schema_document` is written by
# `repo-check docs-schemas-write` from the schema tree the contracts' own
# generation target writes and gates. Neither is edited by hand.
surface_manifest = "skills/printobserver/reference/surface.json"
schema_document = "skills/printobserver/reference/schemas.md"
schema_directory = "schemas"

# Where a documented example is run from, so a reader copying one runs what this
# repository ran. `console` is the fence, `$ ` opens a command line, and the
# lines after it are what that command printed.
example_fence = "console"

# The nine things the skill must carry IN ITS OWN TEXT. Every other rule about
# the skill is about what it may not carry; these are what it owes. A skill that
# is short enough, holds no reference material and links correctly is refused
# unless every marker below is in it, because the skill is the whole of what the
# agent is given before it starts reading — a workflow step left to a linked
# document is one the agent meets after it has already decided what to do.
[[docs.skill_element]]
name = "the supervisory role"
marker = "## The role you are in"

[[docs.skill_element]]
name = "the safety boundaries"
marker = "## The boundaries you work inside"

[[docs.skill_element]]
name = "the statement that nothing sends a command to the printer"
marker = "no path in this system sends a command to the printer"

[[docs.skill_element]]
name = "the escalation path"
marker = "## When to escalate instead"

[[docs.skill_element]]
name = "the workflow step that reads the context"
marker = "1. **Read the context.**"

[[docs.skill_element]]
name = "the workflow step that inspects the image"
marker = "2. **Look at the image.**"

[[docs.skill_element]]
name = "the workflow step that decides"
marker = "3. **Decide.**"

[[docs.skill_element]]
name = "the workflow step that acts with a reason"
marker = "4. **Act, and say why.**"

[[docs.skill_element]]
name = "the workflow step that records what was seen"
marker = "5. **Record what you saw.**"

# Every reference document this repository declares, with the headings each one
# owes. A heading declared here and absent from the document is a failing check
# rather than something a reader notices, and the document's own opening
# coverage statement is held to the headings it actually carries.
[[docs.document]]
path = "skills/printobserver/reference/command-surface.md"
headings = [
    "What a command is made of",
    "The four global options",
    "The exit statuses",
    "The commands",
]

[[docs.document]]
path = "skills/printobserver/reference/api-and-clients.md"
headings = [
    "The one versioned prefix",
    "How a request is authenticated",
    "The operations",
    "The clients",
]

[[docs.document]]
path = "skills/printobserver/reference/architecture.md"
headings = [
    "The crates",
    "Why the crates are cut by domain",
    "Why core names no implementation crate",
    "Why the agent reaches this system the way an operator does",
]

[[docs.document]]
path = "skills/printobserver/reference/schemas.md"
headings = ["The schema set", "The schemas"]

[[docs.document]]
path = "skills/printobserver/reference/common-operations.md"
headings = ["Before you start", "The worked examples"]

[[docs.document]]
path = "skills/printobserver/reference/testing.md"
headings = [
    "The tiers the gate runs",
    "The tiers outside the gate",
]

[[docs.document]]
path = "skills/printobserver/reference/intervention-policy.md"
headings = [
    "Where the bounds come from",
    "What a rejection carries",
    "How a bounded intervention is restored",
    "What expiry does when no prior value was available",
]
