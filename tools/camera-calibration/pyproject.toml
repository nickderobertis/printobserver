# The offline camera calibration tool: a member of the root uv workspace whose
# numpy, scipy and OpenCV nothing else in this repository needs, so they are
# installed only when this package is synced or run.
[project]
name = "camera-calibration"
# No version: this tool is never published, and a version field here would be
# one release automation does not own.
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    # Reading and writing the frames, cutting landmark patches, drawing the
    # verification image, and cross-checking this tool's projection against
    # OpenCV's fisheye model. The fit itself is scipy's.
    "opencv-python-headless>=4.12",
    # Reporting `plate-mass`'s figure to `onebudgetspec check`, which judges the
    # `calibration-plate-filament-grams` budget. Held at the release the root
    # `pyproject.toml` pins, where `just check-repo` holds it to the CLI's.
    "onebudgetspec-sdk==0.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "jsonschema>=4.25",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.14"
root = ["."]
