# The offline camera calibration tool: its own environment, because numpy,
# scipy and OpenCV are needed by nothing else in this repository, and the root
# environment every other Python project shares stays without them.
[project]
name = "camera-calibration"
# No version: this tool is never published, and a version field here would be
# one release automation does not own.
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    # Only to cross-check this tool's own projection against OpenCV's fisheye
    # model; the fit itself is scipy's.
    "opencv-python-headless>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "jsonschema>=4.25",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
pythonpath = [".", "../repo-checks/src"]

[tool.ty.environment]
python-version = "3.14"
root = [".", "../repo-checks/src"]
