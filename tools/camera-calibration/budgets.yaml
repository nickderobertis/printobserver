# The calibration plate's budget. onebudgetspec runs each command from this
# file's directory, so `uv run` here is the registered command
# `uv run --directory tools/camera-calibration python -m camera_calibration plate-mass`
# as it reads from the repository root.
schema_version: 1
budgets:
  - id: calibration-plate-filament-grams
    description: >-
      Filament one calibration plate uses. Grams of PLA one printed calibration
      plate uses: the generated plate mesh's volume times PLA's 1.24 g/cm3.
      Detail: mesh volume in mm3, mark count, and each mark's volume. Inner
      measure, because the plate is printed once per printer by a person, so it
      is measured from the generated mesh rather than a print; the slicer's
      purge and skirt are outside the mesh and excluded. Target at most 1.5 g,
      basis design, measured directly from the committed mesh in about 5
      seconds. Workload: the committed 250 x 220 mm plate for the CORE One,
      `plates/calibration-plate-250x220.stl`, generated with the tool's
      defaults; the user has asked to use little filament, with about 1 g as
      the target. Evidence: a design target of about 1 g of black PLA and the
      user's request to use little filament; 1.5 g leaves headroom for mark
      thickness rounding.
    measure: reported
    command: ["uv", "run", "-q", "python", "-m", "camera_calibration", "plate-mass"]
    unit: grams
    direction: max
    threshold: 1.5
    timeout_seconds: 120
