# What each shard of the `linux-aarch64` and `windows-aarch64` gates runs, and
# how long that took on that platform's runner, read off `main`'s own runs.
# `tests/test_gate_shard_records.py` holds this record to the planner and to
# `ci.yml`: one platform table per split, each shard's `tiers` the tiers
# `just gate-shards <shards>` hands it, its `projects` every project of the
# test tier on its side (each in exactly one shard), and its `total_seconds`
# its overhead plus its tiers, below the `gate-time` budget.
#
# Every figure is from run 42429008618, `main`'s push of 0e7db9eb, which the
# affected tier ran over every project and whose caches were warm.
#
# * A tier's seconds run from the line its recipe logs as it starts to the next
#   one's.
# * A project's seconds run from the first to the last line its test task wrote,
#   so they include building what that task builds. Nx runs three tasks at once,
#   so a shard's projects overlap, and their sum is not the shard's time.
# * A shard's `overhead_seconds` is the time its job spends outside its tiers,
#   from the job's start to its shard step and from its cleanup to its end, plus
#   the aggregating job's time from its start to its `gate-time` step (8 s on
#   both platforms in that run), since `gate-time` charges a context with its
#   longest shard and then that aggregator. A platform's `overhead_seconds` is
#   the gate's fixed overhead there, the largest of its shards'.
# * A shard's `total_seconds` is its overhead plus its tiers.
# * `basis` names where a shard's tiers came from when the run did not split
#   the gate the way this record does.

[linux-aarch64]
# The gate ran unsharded, as `gate (linux-aarch64)` (job 128573495727), in
# 1,490 s: 54 s from the job's start to `just check`, 5 s after its last tier.
# That job ran `test` and `test-e2e` side by side on its 4 processors, so every
# tier figure below was measured under the other tier's load, and a shard
# that runs one of them alone has only that tier's own load.
shards = 5
overhead_seconds = 67

