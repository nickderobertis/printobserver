rule = "S101"
file = "python/printobserver-sdk/tests/test_package.py"
site = "ruff: noqa: S101"
reason = "This module asserts the Python client package imports from a bootstrapped environment. `assert` is pytest's assertion statement: it is what produces the introspected failure message the next reader acts on, and rewriting it as a raised `AssertionError` would lose that. S101 guards shipped code, where it stays enabled and unsuppressed; this file is a pytest module and ships nothing."

