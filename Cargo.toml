# The printobserver Rust workspace.
#
# The dependency rule this design rests on is declared here and enforced by
# `just check-repo` (see `repo-policy.toml` for the crate roles it reads):
#
#   * `printobserver-core` may depend on `printobserver-types` and the four
#     `*-api` port crates, and on NO implementation crate. Core is the layer the
#     product's correctness lives in; the moment it can name an implementation,
#     swapping one becomes a change to core.
#   * No implementation crate may depend on another. Each one adapts exactly one
#     external system to exactly one port; an edge between two of them is a
#     hidden coupling between two vendors.
#
# `printobserver-server` and the `printobserver` binary are the composition
# roots: they are the only crates permitted to name an implementation, because
# something has to choose which one runs.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Written by release automation, and by hand exactly once: `0.1.0` was moved to
# `0.2.0` on 2026-09-10 to unwedge a release path that had published two
# scaffold crates at `0.1.0` and could then draft nothing. AGENTS.md's "Commits,
# releases, and merging" is the record; the next number is release-plz's.
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nickderobertis/printobserver"
authors = ["Nick DeRobertis"]

# The dependency versions the crates of this workspace inherit.
#
# A version stated here is stated once: a crate naming one of these writes
# `<name>.workspace = true` and cannot drift from the rest of the workspace on
# the version, the features, or the path of a sibling crate. Inheriting is
# opt-in per crate, so a crate that still pins its own is unaffected by this
# table and builds exactly as it did.
[workspace.dependencies]
jsonschema = { version = "0.34", default-features = false }
oneharness-core = "0.12.3"
oneharness = "0.11.4"
printobserver-supervisor-api = { path = "crates/printobserver-supervisor-api", version = "0.2.0" }
printobserver-types = { path = "crates/printobserver-types", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
