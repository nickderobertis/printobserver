# The printobserver Rust workspace: twelve crates, cut by domain.
#
# The dependency rule this design rests on is the edge table `repo-policy.toml`'s
# `crates.may_depend_on` declares — for every crate, the workspace crates it may
# depend on, across every dependency table — and `just check-repo` refuses an
# edge the table does not admit. Read together, the rows say:
#
#   * `printobserver-types` is the cross-domain contract, under every crate and
#     depending on nothing; the three `*-api` ports depend on it alone.
#   * `printobserver-core`, the supervision domain, depends on the contract and
#     the three ports and on NO adapter and NO store. Its records, its
#     identifiers and its one-trait-per-aggregate store interfaces live with
#     it; `printobserver-store-sqlite` implements those traits and so depends
#     on core rather than the other way round. Core is the layer the product's
#     correctness lives in; the moment it can name an implementation, swapping
#     one becomes a change to core.
#   * The four implementation crates are named by `printobserver-server`, the
#     composition root, and reached by `printobserver` through it, and by
#     nothing else — so a change to one provider rebuilds that provider's crate
#     and the composition roots, and no implementation crate depends on
#     another, because an edge between two of them is a hidden coupling
#     between two vendors.
#
# The event log is open: the contract crate declares the envelope and no kind,
# each domain declares its own kinds, and a reader of the log carries a kind it
# does not know through rather than matching the log exhaustively.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Release automation's to write. Moved by hand exactly once; AGENTS.md's
# "Commits, releases, and merging" records when and why.
version = "0.10.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nickderobertis/printobserver"
authors = ["Nick DeRobertis"]

# The dependency versions the crates of this workspace inherit.
#
# A version stated here is stated once: a crate naming one of these writes
# `<name>.workspace = true` and cannot drift from the rest of the workspace on
# the version, the features, or the path of a sibling crate. Inheriting is
# opt-in per crate, so a crate that still pins its own is unaffected by this
# table and builds exactly as it did.
#
# Every crate of this workspace another one depends on is named here and
# nowhere else, and every manifest inherits it. Release automation moves the
# one shared version and these requirements together, so a release of any
# subset of the crates cannot leave a sibling requiring a version it has moved
# past, which `cargo update` refuses.
[workspace.dependencies]
base64 = "0.22"
jsonschema ={ version = "0.34", default-features = false }
oneharness-core = "0.12.3"
oneharness = "0.11.4"
plist = { version = "1.10.1", default-features = false }
printobserver-core = { path = "crates/printobserver-core", version = "0.10.4" }
printobserver-obico = { path = "crates/printobserver-obico", version = "0.10.4" }
printobserver-octoprint = { path = "crates/printobserver-octoprint", version = "0.10.4" }
printobserver-oneharness = { path = "crates/printobserver-oneharness", version = "0.10.4" }
printobserver-printer-api = { path = "crates/printobserver-printer-api", version = "0.10.4" }
printobserver-sdk = { path = "crates/printobserver-sdk", version = "0.10.4" }
printobserver-server = { path = "crates/printobserver-server", version = "0.10.4" }
printobserver-store-sqlite = { path = "crates/printobserver-store-sqlite", version = "0.10.4" }
printobserver-supervisor-api = { path = "crates/printobserver-supervisor-api", version = "0.10.4" }
printobserver-types = { path = "crates/printobserver-types", version = "0.10.4" }
printobserver-vision-api = { path = "crates/printobserver-vision-api", version = "0.10.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
# `deny` rather than `forbid` for exactly one site: the Windows server hiding
# the window of a console made for it alone, which is three Win32 calls nothing
# safe wraps. That site carries its own `expect` and its entry in `suppressions.toml`;
# every other site of every crate is still refused.
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
