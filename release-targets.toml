# What this repository publishes, and the name each registry serves it under.
#
# This is the PRODUCER DECLARATION `onevcs` reads, at the path and in the schema
# its own `docs/contract.md` fixes ("The producer declaration"). A consumer that
# has to wait for a change to land here reads it across repositories it does not
# own, so the schema is `onevcs`'s rather than this repository's, and that
# reader refuses a key it does not declare. `just check-repo`'s
# `release-declaration` runs that reader, at the release `uv.lock` holds it at,
# over this file.
#
# Every id below is `<registry>:<name>`, and `<name>` is exactly what that
# registry serves. Each target's `name` is the short name a consumer's plan and
# a host's release rules call it by, so renaming one is a change to every
# consumer naming it: `github-release` in particular is what a consumer
# installing the program from the forge's release waits on.
#
# A target is a CONSUMABLE artifact — one a dependent names in order to depend
# on it — and the tables are in publication order. `just check-repo` derives the
# publishable-crate set from the committed workspace rather than from this file
# and fails on a name that is in one and not the other, in either direction.
#
# NO manifest in this tree carries a version, and that is what makes every id
# below automatic: release automation writes the number into the workspace, and
# `tools/release-artifacts` builds each artifact carrying it. A distribution
# manifest with a version field of its own would be one a person had to keep in
# step, which is the thing Conventional-Commit-driven releasing exists to
# remove — and `just check-repo` refuses one.
#
# `what` is the one sentence a target's own registry shows as its description:
# `tools/release-artifacts` writes it into every wheel and package it builds.
#
# Two facts this repository's tooling reads about a target have no place in
# that schema, so they live in `repo-policy.toml`'s `[release.targets]`, keyed
# by the id below: the END-USER ROUTE a target backs, by the heading `AGENTS.md`'s
# "The end-user install path" gives it, and `built_by`, which tool assembles it.
# `repo_checks.release_declaration` joins the two back together for every
# reader, and `just check-repo`'s `release-targets` refuses a target one of the
# two names and the other does not.
#
# `probe` is the script that answers what a registry serves now for one id
# below, under the probe contract in `onevcs`'s `docs/contract.md` ("What a
# probe prints"). Its own header says how it reads each registry.

schema_version = 3
probe = "tools/repo-checks/src/repo_checks/release-probe.sh"

# The shared domain vocabulary. Every other crate depends on it.
[[target]]
id = "crate:printobserver-types"
name = "crate-types"
what = "Shared domain types for printobserver."
published_by = ".github/workflows/release-plz.yml — the release job's `release-plz release`, under crates/printobserver-types/Cargo.toml's [package] name and the workspace Cargo.toml's version."
manifest = "crates/printobserver-types/Cargo.toml"

