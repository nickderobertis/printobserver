published_by = ".github/workflows/release-plz.yml — the release job's `release-plz release`, under crates/printobserver-printer-api/Cargo.toml's [package] name and the workspace Cargo.toml's version."
manifest = "crates/printobserver-printer-api/Cargo.toml"

