# The steps a continuous-integration job reaching the real-print cases carries,
# verbatim, after its checkout (`lfs: false`, as every checkout is). They run
# only where the job's own `REAL_PRINTS_STORE` is `true`: always in the job that
# runs the suite, and on a push to `main` alone in the job that warms `main`'s
# store. They restore the clone's LFS store from the Actions cache under a key
# of the cases' object ids, falling back by key prefix to the newest older
# store; download, when that key missed, only the objects the restored store
# lacks, saving the store under that key for the next run; and on a hit write
# the files out of the restored store, downloading nothing.
#
# `just check-repo`'s `real-prints-lfs-ci` refuses a job that runs an LFS fetch
# without carrying these steps exactly, or without setting `REAL_PRINTS_STORE`,
# and `tests/real-prints-lfs/test_lfs_fixture.py` runs them over a fixture
# repository and an empty cache, then over the cache that run saved, then over
# an older object set's store.
- id: real-prints-key
  if: env.REAL_PRINTS_STORE == 'true'
  run: just real-prints-cache-key >> "$GITHUB_OUTPUT"
- id: real-prints-cache
  if: env.REAL_PRINTS_STORE == 'true'
  uses: actions/cache/restore@v4
  with:
    path: .git/lfs/objects
    key: ${{ steps.real-prints-key.outputs.key }}
    restore-keys: real-prints-lfs-
- if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit != 'true'
  run: just real-prints-fetch
- if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit != 'true'
  uses: actions/cache/save@v4
  with:
    path: .git/lfs/objects
    key: ${{ steps.real-prints-key.outputs.key }}
- if: env.REAL_PRINTS_STORE == 'true' && steps.real-prints-cache.outputs.cache-hit == 'true'
  run: just real-prints-checkout
